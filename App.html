<style>
  /* ===== Colored theme (teal + amber accents, distinct from a plain black/white look) ===== */
  :root{--bg:#0A0E13;--bg2:#0F1721;--panel:rgba(255,255,255,0.045);--panel2:rgba(255,255,255,0.08);--line:rgba(255,255,255,0.12);--text:#F2F5F8;--muted:#8D9AAC;--accent:#1FD8A6;--accent-dim:#12362C;--accent2:#3FA9F5;--gold:#F5B942;--success:#2ED573;--danger:#FF6B6B;--warn:#F5B942;--btn-text:#03130E;--radius:18px;}
  [data-theme="light"]{--bg:#FAF8F3;--bg2:#F1EEE6;--panel:rgba(10,20,20,0.035);--panel2:rgba(10,20,20,0.06);--line:rgba(10,20,20,0.12);--text:#141A1F;--muted:#5B6672;--accent:#0E9E7E;--accent-dim:#DCF3EA;--accent2:#0B79C7;--gold:#B8790A;--success:#188A4A;--danger:#D3403F;--warn:#B8790A;--btn-text:#FFFFFF;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg));color:var(--text);transition:background .3s,color .3s}
  a{color:inherit}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);z-index:10}
  [data-theme="light"] .nav{background:rgba(255,255,255,0.8)}
  .brand{font-weight:800;color:var(--text);font-size:21px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .nav-links{display:flex;gap:14px;font-size:14px;flex-wrap:wrap;align-items:center}
  .nav-links span{cursor:pointer;color:var(--muted);transition:color .15s}
  .nav-links span:hover{color:var(--text)}
  .hamburger{display:none;cursor:pointer;font-size:20px}
  .theme-toggle{cursor:pointer;font-size:16px;opacity:.85;border:1px solid var(--line);border-radius:20px;padding:4px 10px}
  .wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px}
  .hero{text-align:center;padding:60px 20px;position:relative}
  .hero h1{font-size:36px;margin:0 0 10px;line-height:1.15}
  .hero p{color:var(--muted);max-width:600px;margin:0 auto 22px}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--btn-text);border:none;padding:12px 22px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(31,216,166,.25)}
  [data-theme="light"] .btn{box-shadow:0 4px 14px rgba(14,158,126,.25)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(31,216,166,.35)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
  .btn.ghost:hover{transform:none;background:var(--panel2)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);box-shadow:none}
  .btn.warn{background:var(--panel2);color:var(--gold);border:1px dashed var(--gold);box-shadow:none}
  .btn.small{padding:7px 13px;font-size:12px}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .stats{display:flex;gap:30px;justify-content:center;margin:30px 0;flex-wrap:wrap}
  .stat b{font-size:28px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
  .stat span{color:var(--muted);font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;backdrop-filter:blur(8px);transition:transform .18s,box-shadow .18s,border-color .18s;position:relative}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.28);border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .toggle{display:flex;justify-content:center;gap:8px;margin:8px 0 20px;flex-wrap:wrap}
  .toggle button{padding:10px 18px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;transition:.15s}
  .toggle button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--btn-text);border-color:transparent;font-weight:700}
  .toggle-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center;margin:18px 0 6px;font-weight:700}
  .toggle.sub{margin:0 0 16px;gap:8px;justify-content:center;border-bottom:none}
  .toggle.sub button{padding:12px 14px;font-size:13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--muted);flex:1 1 150px;max-width:260px;text-align:center;margin-bottom:0}
  .toggle.sub button.active{background:var(--accent-dim);border:1px solid var(--accent2);color:var(--accent2);font-weight:700;box-shadow:0 0 0 1px var(--accent2) inset}
  .plan-h{font-weight:700;font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .plan-price{color:var(--accent);font-weight:800;font-size:19px;margin:6px 0}
  .popular-badge{position:absolute;top:-10px;right:14px;background:linear-gradient(135deg,var(--gold),#e08e0f);color:#2b1900;font-size:10px;font-weight:800;padding:3px 10px;border-radius:10px;letter-spacing:.03em}
  .rule{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;padding:4px 0;border-top:1px dashed var(--line)}
  input,select,textarea{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin-bottom:10px;font-size:14px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  .section-title{font-size:21px;font-weight:800;margin:40px 0 14px;text-align:center}
  .faq-q{cursor:pointer;font-weight:700;padding:10px 0;display:flex;justify-content:space-between}
  .faq-a{color:var(--muted);font-size:13px;padding-bottom:10px;display:none}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;border:1px solid var(--line)}
  .b-active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
  .b-pending{background:transparent;color:var(--gold);border:1px dashed var(--gold)}
  .b-closed{background:transparent;color:var(--muted);border:1px solid var(--line);text-decoration:line-through}
  .b-funded{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--btn-text);border-color:transparent;font-weight:800}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .muted{color:var(--muted);font-size:13px}
  .bell{position:relative;cursor:pointer}
  .dot{position:absolute;top:-4px;right:-6px;background:var(--danger);color:#fff;font-size:10px;border-radius:8px;padding:1px 5px}
  .msg{padding:10px;border-radius:10px;margin-bottom:12px;font-size:13px;border:1px solid var(--line)}
  .msg.ok{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
  .msg.err{background:transparent;color:var(--danger);border:1px dashed var(--danger)}
  .kv{font-size:13px;margin:4px 0;color:var(--muted)}
  .kv b{color:var(--text)}
  #notifPanel{position:absolute;right:20px;top:56px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;width:280px;max-height:340px;overflow:auto;display:none;padding:8px;z-index:20;transform:translateY(-8px);opacity:0;transition:transform .2s,opacity .2s}
  #notifPanel.open{display:block;transform:translateY(0);opacity:1}
  .toastbox{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center}
  .download-banner{display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 14px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--btn-text);font-weight:700;font-size:13px;cursor:pointer;text-align:center;flex-wrap:wrap}
  .download-banner:hover{filter:brightness(1.05)}
  .download-banner-btn{background:rgba(0,0,0,.22);color:var(--btn-text);border:1px solid rgba(255,255,255,.4);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;transition:background .15s}
  .download-banner-btn:hover{background:rgba(0,0,0,.34)}
  .toast{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--btn-text);padding:8px 16px;border-radius:20px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:toastin .2s ease-out}
  @keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .custom-alert-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:alertfade .18s ease-out}
  @keyframes alertfade{from{opacity:0}to{opacity:1}}
  .custom-alert-box{position:relative;max-width:380px;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:alertpop .22s ease-out}
  @keyframes alertpop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .custom-alert-close{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
  .custom-alert-img{width:100%;display:block;cursor:pointer;max-height:70vh;object-fit:cover}
  .custom-alert-title{padding:12px 16px;font-weight:700;font-size:15px;text-align:center}
  .chat-fab{position:fixed;bottom:18px;right:18px;background:var(--text);color:var(--bg);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:30;transition:transform .15s}
  .chat-fab:hover{transform:scale(1.06)}
  .chat-panel{position:fixed;bottom:80px;right:18px;width:280px;max-height:380px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;display:none;flex-direction:column;z-index:30;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .chat-msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
  .chat-msg{max-width:80%;padding:6px 10px;border-radius:10px;font-size:13px}
  .chat-msg.user{align-self:flex-end;background:var(--accent);color:var(--btn-text)}
  .chat-msg.admin{align-self:flex-start;background:var(--panel2)}
  .chat-input{display:flex;border-top:1px solid var(--line)}
  .chat-input input{margin:0;border:none;border-radius:0}
  .progress{background:var(--panel2);border-radius:8px;height:8px;overflow:hidden;margin:6px 0}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
  .progress.warn i{background:var(--gold)}
  .progress.danger i{background:var(--danger)}
  /* ---- pill tabs (affiliate / support) ---- */
  .pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
  .pill{flex:0 0 auto;padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;white-space:nowrap;transition:.15s}
  .pill.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--btn-text);border-color:transparent;font-weight:700}
  .stat-mini{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel);border-left:3px solid var(--accent)}
  .stat-mini .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .stat-mini .val{font-size:20px;font-weight:800;margin-top:4px}
  .promo-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);margin-bottom:14px}
  .promo-card img{width:100%;display:block;border-bottom:1px solid var(--line)}
  .copybar{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;cursor:pointer;font-weight:700;font-size:13px}
  .copybar:hover{background:var(--panel2)}
  .tier-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
  .tier-row.current{border-color:var(--accent);background:var(--accent-dim)}
  .tier-icon{width:40px;height:40px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
  .tier-icon.locked{opacity:.4}
  .ticket-row{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
  .ticket-row:hover{border-color:var(--accent)}
  .ms-bar{background:var(--panel2);border-radius:8px;height:6px;overflow:hidden;margin-top:8px}
  .ms-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .pw-meter{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:-4px 0 10px}
  .pw-meter i{display:block;height:100%;width:0%;transition:width .2s,background .2s}
  .skeleton{background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:var(--radius);height:80px;margin-bottom:14px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .fade-in{animation:fadein .3s ease-out}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .progress-track{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
  .progress-track i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 5s linear}
  /* ---- Now Funded payment widget (bank-transfer screen) ---- */
  .payment-widget{background:#F4F8F7;border-radius:16px;overflow:hidden;color:#141A1F;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .pw-head{padding:16px 18px 8px;font-size:19px;font-weight:800;letter-spacing:.2px}
  .pw-brand{display:flex;align-items:center;justify-content:space-between;padding:0 18px 14px;border-bottom:3px solid var(--accent)}
  .pw-brand-name{font-weight:800;font-size:18px;color:#141A1F}
  .pw-body{padding:20px 18px 22px}
  .pw-note{text-align:center;font-size:14px;color:#3A4550;margin-bottom:14px}
  .pw-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:13px;color:#5B6672}
  .pw-val{font-weight:800;color:#141A1F;display:flex;align-items:center;gap:6px;font-size:15px}
  .pw-copy{width:14px;height:14px;cursor:pointer;color:#8D9AAC}
  .pw-expiry{text-align:center;font-size:13px;color:#D3403F;margin-top:14px}
  .pw-warn{text-align:center;font-size:12px;color:#D3403F;margin-top:6px}
  .pw-btn-primary{width:100%;margin-top:16px;padding:14px;border-radius:10px;border:1px solid #141A1F;background:transparent;color:#141A1F;font-weight:800;font-size:14px;cursor:pointer}
  .pw-btn-outline{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid rgba(20,26,31,.25);background:transparent;color:#3A4550;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .pw-cancel{text-align:center;margin-top:16px;font-weight:800;font-size:13px;color:#141A1F;cursor:pointer}
  @media (max-width:640px){
    .hamburger{display:block}
    .btn:not(.small){width:100%}
    .nav-links{display:none}
    .wrap{padding:16px 14px 50px}
    .hero{padding:36px 10px}
    .hero h1{font-size:26px}
    .hero p{font-size:14px}
    .section-title{font-size:18px;margin:30px 0 12px}
    .stats{gap:20px}
    input,select,textarea{font-size:16px} /* prevents iOS Safari auto-zoom on focus */
  }
  /* ---- full slide-in drawer menu (hamburger) ---- */
  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;opacity:0;transition:opacity .2s}

  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);background:var(--bg2);border-left:1px solid var(--line);z-index:61;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease-out;box-shadow:-8px 0 30px rgba(0,0,0,.4)}
  .drawer.open{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .drawer-head b{font-size:17px}

  .drawer-item:hover{background:var(--panel2)}
  .drawer-item.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);font-weight:700}
  .drawer-item .dnew{margin-left:auto;background:var(--gold);color:#2b1900;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px}
  .drawer-foot{border-top:1px solid var(--line);padding:14px}

  .drawer-user img{width:36px;height:36px;border-radius:50%;object-fit:cover}
  .drawer-user .nm{font-weight:700;font-size:14px}
  .drawer-user .em{font-size:12px;color:var(--muted)}

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t==='light'?'light':'');
  var btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = t==='light' ? '● Dark' : '○ Light';
  try{ localStorage.setItem('nf_theme', t); }catch(e){}
}
function toggleTheme(){
  var isLight = document.documentElement.getAttribute('data-theme')==='light';
  applyTheme(isLight?'dark':'light');
}
function loadTheme(){
  var saved = 'dark';
  try{ saved = localStorage.getItem('nf_theme') || 'dark'; }catch(e){}
  applyTheme(saved);
}
function toggleMenu(){ menuOpen ? closeMenu() : openMenu(); }
function openMenu(){
  menuOpen = true;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerBackdrop').classList.add('open');
}
function closeMenu(){
  menuOpen = false;
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
}
function drawerNav(v){ closeMenu(); go(v); }
function drawerNavAnchor(v, anchorId){
  closeMenu();
  go(v);
  setTimeout(function(){ var el=document.getElementById(anchorId); if(el) el.scrollIntoView({behavior:'smooth'}); }, 60);
}
function refreshIcons(){ if(window.lucide) lucide.createIcons(); }

function boot(){
  loadTheme();
  fetch(WEBAPP_URL + '?action=read')
    .then(function(r){ return r.json(); })
    .then(function(data){
      STATE = (typeof data === 'string') ? JSON.parse(data) : data;
      seedIfEmpty();
      applySeo();
      renderNav();
      route();
    })
    .catch(function(err){ document.getElementById('app').innerHTML = '<div class="card">Could not reach backend. Check WEBAPP_URL. '+err+'</div>'; });
}

  function setMeta(selector, attr, value){
    if(!value) return;

  }
  if(seo.title){ document.title = seo.title; }
  setMeta('meta[name="description"]', 'content', seo.description);
  setMeta('meta[name="keywords"]', 'content', seo.keywords);

  setMeta('link[rel="canonical"]', 'href', seo.canonicalUrl);
  setMeta('meta[property="og:url"]', 'content', seo.canonicalUrl);
  setMeta('link#faviconLink', 'href', seo.favicon);

// ---- Custom Account Alerts (admin-created popups shown to logged-in users) ----
// Admin sets: image, optional link, which screen triggers it, max times per user,
// and a cooldown (hours) before it can show again. Views are tracked per-user in
// u.alertViews[alertId] = {count, lastShown}. Multiple eligible alerts queue up
// and are shown one at a time so they never stack on top of each other.
var pendingAlertQueue = [];
var alertModalShowing = false;
function checkAlerts(trigger){
  var u = currentUser();
  if(!u) return; // alerts are account-based — only shown to logged-in users
  var eligible = (STATE.settings.customAlerts||[]).filter(function(a){
    if(!a.active || !a.imageUrl) return false;
    if(a.targetScreen !== trigger && a.targetScreen !== 'any') return false;
    var v = (u.alertViews && u.alertViews[a.id]) || {count:0,lastShown:null};
    if(a.maxShows && v.count >= a.maxShows) return false;
    if(v.lastShown && a.cooldownHours){
      var elapsedHrs = (Date.now() - new Date(v.lastShown).getTime())/3600000;
      if(elapsedHrs < a.cooldownHours) return false;
    }
    return true;
  });
  eligible.forEach(function(a){ if(pendingAlertQueue.indexOf(a.id)===-1) pendingAlertQueue.push(a.id); });
  if(!alertModalShowing) showNextAlert();
}
function showNextAlert(){
  if(!pendingAlertQueue.length) return;
  var id = pendingAlertQueue.shift();
  var a = (STATE.settings.customAlerts||[]).find(function(x){return x.id===id;});
  if(!a || !a.active) return showNextAlert();
  displayAlertModal(a);
}
function displayAlertModal(a){
  alertModalShowing = true;
  var u = currentUser();
  if(u){
    if(!u.alertViews) u.alertViews = {};
    var v = u.alertViews[a.id] || {count:0,lastShown:null};
    v.count = (v.count||0) + 1;
    v.lastShown = new Date().toISOString();
    u.alertViews[a.id] = v;
    save();
  }
  var old = document.getElementById('customAlertOverlay');
  if(old) old.remove();
  var overlay = document.createElement('div');
  overlay.className = 'custom-alert-overlay';
  overlay.id = 'customAlertOverlay';
  overlay.onclick = function(e){ if(e.target===overlay) closeCustomAlert(); };
  overlay.innerHTML = '<div class="custom-alert-box">'+
    '<div class="custom-alert-close" onclick="closeCustomAlert()"><i data-lucide="x" style="width:16px;height:16px"></i></div>'+
    '<img class="custom-alert-img" src="'+a.imageUrl+'" alt="" onclick="handleAlertClick(\''+a.id+'\')">'+
    (a.title?'<div class="custom-alert-title">'+a.title+'</div>':'')+
    '</div>';
  document.body.appendChild(overlay);
  refreshIcons();
}
function handleAlertClick(id){
  var a = (STATE.settings.customAlerts||[]).find(function(x){return x.id===id;});
  closeCustomAlert();
  if(a && a.linkUrl) window.open(a.linkUrl, '_blank');
}
function closeCustomAlert(){
  var overlay = document.getElementById('customAlertOverlay');
  if(overlay) overlay.remove();
  alertModalShowing = false;
  setTimeout(showNextAlert, 400);
}

function setDD(id){ planFilterDD=id; render(); }
function setPlanType(id){ planFilterType=id; render(); }
function previewPlanPrice_(plan, code){
  var unit = plan.price;
  if(!code) return {price:unit, applied:false};
  var dc = STATE.discountCodes.find(function(d){return d.code===code && d.active;});
  if(!dc) return {error:'Invalid or inactive code'};
  if(dc.expiryDate && new Date(dc.expiryDate) < new Date()) return {error:'Code expired'};
  if(discountCodeUsage_(dc) >= dc.usageLimit) return {error:'Code usage limit reached'};
  var previewUser = currentUser();
  if(dc.perUserLimit && previewUser && discountCodeUserUsage_(dc, previewUser.id) >= dc.perUserLimit) return {error:'You\'ve already used this code the maximum number of times'};
  if(dc.scope!=='all' && dc.scope.indexOf(plan.id)===-1) return {error:'Code not valid for this plan'};
  unit = dc.type==='percent' ? unit - (unit*dc.value/100) : Math.max(0,unit-dc.value);
  return {price:Math.round(unit), applied:true, code:dc.code};
}
function applyCardDiscount(planId){
  var plan = STATE.plans.find(function(p){return p.id===planId;});
  var input = document.getElementById('cardCode_'+planId);
  var code = input ? input.value.trim() : '';
  var out = document.getElementById('cardPrice_'+planId);
  if(!plan || !out) return;
  var result = previewPlanPrice_(plan, code);
  window._planCardCode = window._planCardCode || {};
  if(result.error){
    out.innerHTML = '<span style="color:var(--danger)">'+result.error+'</span>';
    delete window._planCardCode[planId];
    return;
  }
  if(result.applied){
    out.innerHTML = 'Price with code "'+result.code+'": <s class="muted">'+naira(plan.price)+'</s> <b style="color:var(--accent)">'+naira(result.price)+'</b>';
    window._planCardCode[planId] = result.code;
  } else {
    out.innerHTML = '';
    delete window._planCardCode[planId];
  }
}

function pickAvatar(id){
  suAvatar = id;
  var opts = document.querySelectorAll('#avatarPicker .avatar-opt');
  opts.forEach(function(im){ im.style.borderColor = (im.getAttribute('data-avatar-id')===id) ? 'var(--accent)' : 'transparent'; });
}
function updatePwMeter(){
  var v = document.getElementById('su_pass').value;
  var score = 0;
  if(v.length>=6) score++;
  if(v.length>=10) score++;
  if(/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v)) score++;
  var pct = [10,25,55,80,100][score];
  var color = ['#E5484D','#E5484D','#F5A623','#F5A623','#1FD8A6'][score];
  var bar = document.getElementById('pwbar');
  bar.style.width = pct+'%'; bar.style.background = color;
}
function doSignup(){
  var name=document.getElementById('su_name').value.trim();
  var email=document.getElementById('su_email').value.trim().toLowerCase();

// Renders a 3-dot stepper for B-Book / H-Book / In-House Trader progression.

function bookStageStepper_(bookStage){
  var stages = (STATE.bookStages && STATE.bookStages.length) ? STATE.bookStages : [
    {id:'bbook',name:'B-Book'},{id:'hbook',name:'H-Book'},{id:'inhouse',name:'In-House Trader'}
  ];
  var idx = stages.findIndex(function(s){return s.id===bookStage;});
  if(idx<0) idx = 0;
  var current = stages[idx] || stages[0];
  var dots = stages.map(function(s,i){
    var state = i<idx ? 'done' : i===idx ? 'current' : 'todo';
    var color = state==='todo' ? 'var(--line)' : 'var(--accent)';
    var size = state==='current' ? '10px' : '7px';
    return '<div style="width:'+size+';height:'+size+';border-radius:50%;background:'+color+'"></div>'+(i<stages.length-1?'<div style="flex:1;height:2px;background:'+(i<idx?'var(--accent)':'var(--line)')+'"></div>':'');
  }).join('');
  return '<div class="kv" style="margin-top:6px"><span style="font-size:11px;color:var(--muted)">Book Stage</span></div>'+
    '<div style="display:flex;align-items:center;gap:4px;margin:4px 0 2px">'+dots+'</div>'+
    '<div style="font-size:12px;font-weight:700;color:var(--accent)">'+current.name+'</div>';

function equityCurveSvg(history){
  if(!history || history.length<2) return '';
  var vals = history.map(function(h){return h.equity;});
  var min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
  var range = (max-min)||1;
  var w=260,h=50;
  var pts = vals.map(function(v,i){ var x=(i/(vals.length-1))*w; var y=h-((v-min)/range)*h; return x+','+y; }).join(' ');
  return '<div class="kv" style="margin-top:6px">Equity History</div><svg width="'+w+'" height="'+h+'" style="display:block"><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>';
}

// ---- Certificate image download (rendered client-side onto a canvas, then exported as PNG) ----
function downloadCertificate(certId){
  var c = STATE.certificates.find(function(x){return x.id===certId;});
  if(!c) return;
  var u = STATE.users.find(function(x){return x.id===c.userId;});
  var acc = STATE.traderAccounts.find(function(x){return x.id===c.traderAccountId;});
  var isFunded = c.type==='funded';
  var title = isFunded ? 'Funded Trader Certificate' : 'Phase 1 Completion Certificate';
  var desc = isFunded ? 'has successfully been awarded a Funded Trading Account' : 'has successfully completed Phase 1 of the Now Funded Challenge';

  var canvas = document.createElement('canvas');
  canvas.width = 1400; canvas.height = 990;
  var ctx = canvas.getContext('2d');

  var bgGrad = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  bgGrad.addColorStop(0,'#0F1721'); bgGrad.addColorStop(1,'#0A0E13');
  ctx.fillStyle = bgGrad; ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle = '#F5B942'; ctx.lineWidth = 6;
  ctx.strokeRect(30,30,canvas.width-60,canvas.height-60);
  ctx.strokeStyle = 'rgba(31,216,166,0.55)'; ctx.lineWidth = 2;
  ctx.strokeRect(52,52,canvas.width-104,canvas.height-104);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#1FD8A6'; ctx.font = 'bold 32px Arial';
  ctx.fillText('NOW FUNDED', canvas.width/2, 145);

  ctx.fillStyle = '#F2F5F8'; ctx.font = 'bold 50px Georgia, serif';
  ctx.fillText(title.toUpperCase(), canvas.width/2, 250);

  ctx.fillStyle = '#8D9AAC'; ctx.font = '20px Arial';
  ctx.fillText('This certifies that', canvas.width/2, 330);

  ctx.fillStyle = '#F5B942'; ctx.font = 'bold 58px Georgia, serif';
  ctx.fillText(u ? u.name : 'Trader', canvas.width/2, 415);

  ctx.fillStyle = '#F2F5F8'; ctx.font = '22px Arial';
  wrapCenteredText_(ctx, desc, canvas.width/2, 470, 900, 30);

  if(acc){
    ctx.fillStyle = '#8D9AAC'; ctx.font = '18px Arial';
    ctx.fillText('Account Login: '+acc.login+'   ·   Category: '+acc.category, canvas.width/2, 555);
  }

  ctx.fillStyle = '#8D9AAC'; ctx.font = '18px Arial';
  ctx.fillText('Issued on '+new Date(c.issuedAt).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}), canvas.width/2, 860);

  ctx.strokeStyle = '#8D9AAC'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(canvas.width/2-150,900); ctx.lineTo(canvas.width/2+150,900); ctx.stroke();
  ctx.fillStyle = '#8D9AAC'; ctx.font = '15px Arial';
  ctx.fillText('Now Funded — Authorized Signature', canvas.width/2, 925);

  var url = canvas.toDataURL('image/png');
  var a = document.createElement('a');
  a.href = url;
  a.download = 'NowFunded-'+(isFunded?'Funded':'Phase1')+'-Certificate-'+(u?u.name.replace(/\s+/g,'_'):'trader')+'.png';
  document.body.appendChild(a); a.click(); a.remove();
}
function wrapCenteredText_(ctx, text, x, y, maxWidth, lineHeight){
  var words = text.split(' '), line = '', lines = [];
  for(var i=0;i<words.length;i++){
    var test = line + words[i] + ' ';
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = words[i] + ' '; }
    else line = test;
  }
  lines.push(line);
  var startY = y - ((lines.length-1)*lineHeight)/2;
  lines.forEach(function(l,i){ ctx.fillText(l.trim(), x, startY + i*lineHeight); });
}
// ---- Account Transfers (user-to-user, instant on acceptance, no fee, no admin approval) ----
function initiateTransfer(accountId){
  var acc = STATE.traderAccounts.find(function(a){return a.id===accountId;});
  if(!acc || acc.userId!==currentUserId) return;
  var existingPending = STATE.accountTransfers.find(function(t){return t.accountId===accountId && t.status==='pending';});
  if(existingPending) return alert('This account already has a pending transfer request. Cancel it first if you want to send a new one.');
  var email = prompt("Enter the recipient's registered email to transfer this account to:");
  if(!email) return;
  email = email.trim().toLowerCase();
  var me = currentUser();
  if(email === (me.email||'').toLowerCase()) return alert("You can't transfer an account to yourself.");
  var recipient = STATE.users.find(function(u){return (u.email||'').toLowerCase()===email;});
  if(!recipient) return alert('No registered user found with that email.');
  var t = {id:uid('tr'), accountId:accountId, accountCategory:acc.category, fromUserId:currentUserId, toUserId:recipient.id, status:'pending', createdAt:new Date().toISOString(), respondedAt:null};
  STATE.accountTransfers.push(t);
  notify(recipient.id, (me.name||me.email)+' wants to transfer their '+acc.category+' account to you. Visit your Dashboard to accept or decline.');
  save(function(){ toast('Transfer request sent to '+email); render(); });
}
function acceptTransfer(transferId){
  var t = STATE.accountTransfers.find(function(x){return x.id===transferId;});
  if(!t || t.status!=='pending' || t.toUserId!==currentUserId) return;
  var acc = STATE.traderAccounts.find(function(a){return a.id===t.accountId;});
  if(!acc){ t.status='declined'; t.respondedAt=new Date().toISOString(); save(function(){render();}); return alert('That account no longer exists.'); }
  acc.userId = currentUserId;
  t.status = 'accepted';
  t.respondedAt = new Date().toISOString();
  notify(t.fromUserId, currentUser().name+' accepted your transfer of the '+t.accountCategory+' account.');
  save(function(){ toast('Account transferred to you'); render(); });
}
function declineTransfer(transferId){
  var t = STATE.accountTransfers.find(function(x){return x.id===transferId;});
  if(!t || t.status!=='pending' || t.toUserId!==currentUserId) return;
  t.status = 'declined';
  t.respondedAt = new Date().toISOString();
  notify(t.fromUserId, currentUser().name+' declined your transfer of the '+t.accountCategory+' account.');
  save(function(){ toast('Transfer declined'); render(); });
}
function cancelTransfer(transferId){
  var t = STATE.accountTransfers.find(function(x){return x.id===transferId;});
  if(!t || t.status!=='pending' || t.fromUserId!==currentUserId) return;
  t.status = 'cancelled';

  save(function(){ toast('Transfer request cancelled'); render(); });
}

  if(!incoming.length && !outgoing.length) return '';

function discountCodeUsage_(dc){
  // "Used" for capacity purposes = confirmed orders (dc.usedCount, incremented only on
  // confirmation) plus any currently-pending orders on this code — reserving capacity
  // for orders still awaiting admin confirmation. A rejected order was never counted, so
  // there's nothing to roll back when one is rejected.
  var pending = STATE.orders.filter(function(o){ return o.discountCode===dc.code && o.status==='pending'; }).length;
  return (dc.usedCount||0) + pending;
}
function discountCodeUserUsage_(dc, userId){
  return STATE.orders.filter(function(o){
    return o.discountCode===dc.code && o.userId===userId && o.status!=='rejected';
  }).length;
}
function computeCheckoutAmount_(plan, code){
  var user = currentUser();
  var unit = plan.price;
  var usedDiscountCode = null, error = null;
  if(code){
    var dc = STATE.discountCodes.find(function(d){return d.code===code && d.active;});
    if(!dc) error = 'Invalid or inactive code';
    else if(dc.expiryDate && new Date(dc.expiryDate) < new Date()) error = 'Code expired';
    else if(discountCodeUsage_(dc) >= dc.usageLimit) error = 'Code usage limit reached';
    else if(dc.perUserLimit && discountCodeUserUsage_(dc, user.id) >= dc.perUserLimit) error = 'You\'ve already used this code the maximum number of times';
    else if(dc.scope!=='all' && dc.scope.indexOf(plan.id)===-1) error = 'Code not valid for this plan';
    else { unit = dc.type==='percent' ? unit - (unit*dc.value/100) : Math.max(0,unit-dc.value); usedDiscountCode = dc.code; }
  } else if(user.referredBy){
    var scope = STATE.settings.referralDiscountScope || 'every';
    var isFirstOrder = !STATE.orders.some(function(o){return o.userId===user.id;});
    if(scope==='every' || isFirstOrder) unit = unit - (unit*STATE.settings.affiliateDiscountRate/100);
  }
  return {unit:Math.round(unit), usedDiscountCode:usedDiscountCode, error:error};
}

function fundedProfitShare_(userId){
  var funded = STATE.traderAccounts.filter(function(a){return a.userId===userId && a.stage==='funded' && a.status!=='closed';});
  var splitPct = STATE.settings.profitSplitPct || 80;
  var totalProfit = funded.reduce(function(sum,a){ return sum + Math.max(0, (a.currentBalance-a.startBalance)); }, 0);
  var earned = Math.round(totalProfit*splitPct/100);
  // Anything already paid, or currently sitting in a pending request, is no longer
  // available — otherwise the same profit could be withdrawn repeatedly (paid requests
  // don't reduce the account balance) or drained twice by overlapping pending requests.
  var alreadyClaimed = STATE.payoutRequests.filter(function(p){
    return p.userId===userId && p.type==='trader' && (p.status==='paid' || p.status==='pending');
  }).reduce(function(sum,p){ return sum + p.amount; }, 0);
  var available = Math.max(0, earned - alreadyClaimed);
  return { funded:funded, splitPct:splitPct, totalProfit:totalProfit, earned:earned, alreadyClaimed:alreadyClaimed, available: available };
}
// affiliateEarnings is a lifetime running total credited on each referred purchase.
// It's never decremented, so "available to withdraw" must be computed as earned minus
// whatever's already been paid or is sitting in a pending request — otherwise the same
// commission balance could be requested and approved over and over.
function affiliateAvailable_(userId){
  var u = STATE.users.find(function(x){return x.id===userId;});
  var earned = (u && u.affiliateEarnings) || 0;
  var alreadyClaimed = STATE.payoutRequests.filter(function(p){
    return p.userId===userId && p.type==='affiliate' && (p.status==='paid' || p.status==='pending');
  }).reduce(function(sum,p){ return sum + p.amount; }, 0);
  return Math.max(0, earned - alreadyClaimed);
}

  if(u.kycStatus!=='approved') return msg('Complete identity verification before requesting a payout.','err');
  var type=document.getElementById('po_type').value;
  var amount=Number(document.getElementById('po_amount').value);
  var bankName=document.getElementById('po_bankname').value.trim();
  var accNo=document.getElementById('po_accno').value.trim();
  var accName=document.getElementById('po_accname').value.trim();
  var min = type==='affiliate' ? STATE.settings.minAffiliatePayout : STATE.settings.minPayout;
  if(!amount || amount<min) return msg('Minimum payout is '+naira(min),'err');
  if(type==='trader'){
    var ps = fundedProfitShare_(currentUserId);
    if(!ps.funded.length) return msg('You need a funded account to request a profit-share payout.','err');
    if(amount > ps.available) return msg('Amount exceeds your available profit share of '+naira(ps.available),'err');
  }
  if(type==='affiliate'){
    var affAvail = affiliateAvailable_(currentUserId);
    if(amount > affAvail) return msg('Amount exceeds your available affiliate earnings of '+naira(affAvail),'err');
  }
  if(!bankName) return msg('Enter your bank name','err');
  if(!/^\d{10}$/.test(accNo)) return msg('Account number must be exactly 10 digits','err');
  if(!accName) return msg('Enter the account name','err');
  document.getElementById('msg').innerHTML='';
  document.getElementById('payoutReview').innerHTML =
    '<div class="card" style="border:1px solid var(--accent)">'+
    '<div class="row" style="gap:8px;margin-bottom:6px"><i data-lucide="shield-check" style="width:16px;height:16px;color:var(--accent)"></i><b>Confirm these details</b></div>'+
    '<div class="kv">Amount: <b>'+naira(amount)+'</b></div>'+
    '<div class="kv">Bank: <b>'+bankName+'</b></div>'+
    '<div class="kv">Account Number: <b>'+accNo+'</b></div>'+
    '<div class="kv">Account Name: <b>'+accName+'</b></div>'+
    '<div class="muted" style="margin:8px 0;font-size:12px">Double-check the account number — payouts sent to the wrong account cannot always be recovered.</div>'+
    '<button class="btn" style="width:100%" onclick="submitPayout()">Confirm & Submit</button>'+
    '<button class="btn ghost" style="width:100%;margin-top:8px" onclick="document.getElementById(\'payoutReview\').innerHTML=\'\'">Edit Details</button>'+
    '</div>';
  refreshIcons();
}
function submitPayout(){
  var type=document.getElementById('po_type').value;
  var amount=Number(document.getElementById('po_amount').value);
  var bankName=document.getElementById('po_bankname').value.trim();
  var accNo=document.getElementById('po_accno').value.trim();
  var accName=document.getElementById('po_accname').value.trim();
  var bank = bankName+' · '+accNo+' · '+accName;
  var uid_ = currentUserId;
  // Re-fetch fresh state right before writing — STATE in memory may be stale (loaded at
  // page boot, or sitting on the review screen for a while), and this is the point money
  // actually gets reserved. Re-validating against fresh data closes most of the window
  // where two overlapping requests (another tab, another device, an already-approved
  // payout since page load) could otherwise both look valid.
  fetch(WEBAPP_URL + '?action=read').then(function(r){ return r.json(); }).then(function(data){
    var fresh = (typeof data === 'string') ? JSON.parse(data) : data;
    STATE.payoutRequests = fresh.payoutRequests || [];
    STATE.traderAccounts = fresh.traderAccounts || [];
    STATE.users = fresh.users || [];
    var u = currentUser();
    if(!u) return msg('Session expired — please log in again.','err');
    if(u.kycStatus!=='approved') return msg('Complete identity verification before requesting a payout.','err');
    if(type==='trader'){
      var ps = fundedProfitShare_(uid_);
      if(amount > ps.available) return msg('Amount exceeds your available profit share of '+naira(ps.available)+' (this may have changed).','err');
    } else {
      var affAvail = affiliateAvailable_(uid_);
      if(amount > affAvail) return msg('Amount exceeds your available affiliate earnings of '+naira(affAvail)+' (this may have changed).','err');
    }
    if(document.getElementById('po_save')&&document.getElementById('po_save').checked){
      u.savedBankDetails = {bankName:bankName, accNo:accNo, accName:accName};
    }
    STATE.payoutRequests.push({id:uid('po'),userId:uid_,type:type,amount:amount,bankDetails:bank,status:'pending',createdAt:new Date().toISOString()});
    sendMail(adminEmail_(), 'New payout request', 'User '+(u.email||u.name||uid_)+' requested a '+type+' payout of '+naira(amount)+'.');
    save(function(){ msg('Payout request submitted.','ok'); render(); });
  }).catch(function(err){ msg('Could not verify your balance — please try again.','err'); });
}

// ---------- AFFILIATE ----------
var affTab = 'dashboard';
function affReferredConverted_(u){
  return STATE.users.filter(function(x){return x.referredBy===u.id;}).filter(function(x){
    return STATE.orders.some(function(o){return o.userId===x.id && o.status==='confirmed';});
  }).length;
}
function affCurrentTier_(u){
  var tiers = (STATE.settings.affiliateTiers||[]).slice().sort(function(a,b){return a.minReferrals-b.minReferrals;});
  var converted = affReferredConverted_(u);
  var current = tiers[0], next = null;
  tiers.forEach(function(t){ if(converted>=t.minReferrals) current=t; });
  for(var i=0;i<tiers.length;i++){ if(tiers[i].minReferrals>converted){ next=tiers[i]; break; } }
  return {tiers:tiers, current:current||{name:'Affiliate Starter',commissionPct:STATE.settings.affiliateCommissionRate||15}, next:next, converted:converted};
}
function renderAffiliate(){
  if(!currentUserId) return renderLogin();
  var u = currentUser();
  var referred = STATE.users.filter(function(x){return x.referredBy===u.id;});
  var revenue = STATE.orders.filter(function(o){return o.status==='confirmed' && referred.some(function(r){return r.id===o.userId;});}).reduce(function(s,o){return s+o.amount;},0);
  var converted = affReferredConverted_(u);
  var rate = referred.length ? (converted/referred.length*100) : 0;
  var tierInfo = affCurrentTier_(u);
  var tabs = ['dashboard','milestones','links','referrals','earnings'];
  if((STATE.settings.affiliateToolkit||[]).length) tabs.push('toolkit');
  var tabLabels = {dashboard:'Dashboard',milestones:'Milestones',links:'My Links',referrals:'Referrals',earnings:'Earnings',toolkit:'Toolkit'};
  var header = '<div class="row" style="align-items:center"><h2 style="margin:0">Affiliate</h2>'+
    '<button class="btn small" onclick="go(\'payout\')">Cash Out</button></div>'+
    '<div class="row" style="gap:6px;margin:6px 0 14px"><span class="badge b-active">'+tierInfo.current.name+'</span><span class="muted">'+tierInfo.current.commissionPct+'% commission</span></div>'+
    '<div class="grid" style="margin-bottom:14px">'+
    '<div class="stat-mini" style="border-left:3px solid var(--accent)"><div class="lbl">Total Earnings</div><div class="val">'+naira(u.affiliateEarnings||0)+'</div></div>'+
    '<div class="stat-mini" style="border-left:3px solid var(--accent2)"><div class="lbl">Available</div><div class="val">'+naira(affiliateAvailable_(u.id))+'</div></div>'+
    '<div class="stat-mini" style="border-left:3px solid var(--gold)"><div class="lbl">Conversions</div><div class="val">'+converted+'</div><div class="muted" style="font-size:11px">'+rate.toFixed(1)+'% rate</div></div>'+
    '<div class="stat-mini" style="border-left:3px solid var(--success)"><div class="lbl">Revenue</div><div class="val">'+naira(revenue)+'</div></div>'+
    '</div>'+
    '<div class="pills">'+tabs.map(function(t){return '<div class="pill '+(affTab===t?'active':'')+'" onclick="affTab=\''+t+'\';render()">'+tabLabels[t]+'</div>';}).join('')+'</div>';
  var body = '';
  if(affTab==='dashboard') body = renderAffDashboard_(u, tierInfo, referred);
  else if(affTab==='milestones') body = renderAffMilestones_(tierInfo);
  else if(affTab==='links') body = renderAffLinks_(u);
  else if(affTab==='referrals') body = renderAffReferrals_(referred);
  else if(affTab==='earnings') body = renderAffEarnings_(u);
  else if(affTab==='toolkit') body = renderAffToolkit_();
  return header + body;
}
function renderAffDashboard_(u, tierInfo, referred){
  var pct = tierInfo.next ? Math.min(100, (tierInfo.converted/tierInfo.next.minReferrals*100)) : 100;
  return '<div class="card"><div class="row"><b>'+tierInfo.current.name+'</b>'+(tierInfo.next?'<span class="muted">'+Math.max(0,tierInfo.next.minReferrals-tierInfo.converted)+' more to '+tierInfo.next.name+'</span>':'<span class="muted">Top tier reached</span>')+'</div>'+
    (tierInfo.next? '<div class="ms-bar"><i style="width:'+pct+'%"></i></div><div class="muted" style="font-size:12px;margin-top:4px">'+tierInfo.converted+' / '+tierInfo.next.minReferrals+' converted referrals</div>':'')+'</div>'+
    '<div class="card"><div class="kv">Referrals get '+STATE.settings.affiliateDiscountRate+'% off automatically. You earn '+tierInfo.current.commissionPct+'% commission when their order is confirmed.</div>'+
    '<div class="kv">Total referred users: <b>'+referred.length+'</b></div></div>';
}
function renderAffMilestones_(tierInfo){
  return tierInfo.tiers.map(function(t,i){
    var isCurrent = t.id===tierInfo.current.id;
    var isLocked = t.minReferrals > tierInfo.converted;
    return '<div class="tier-row '+(isCurrent?'current':'')+'"><div class="tier-icon '+(isLocked?'locked':'')+'"><i data-lucide="'+(isLocked?'lock':'award')+'" style="width:18px;height:18px"></i></div>'+
      '<div style="flex:1"><div class="row"><b>'+t.name+'</b>'+(isCurrent?'<span class="badge b-active">CURRENT</span>':'')+'</div>'+
      '<div class="muted" style="font-size:12px">'+(i===0?'Start here':t.minReferrals+' converted referrals')+' · '+t.commissionPct+'% commission</div></div></div>';
  }).join('') + '<div class="card" style="text-align:center"><i data-lucide="trophy" style="width:28px;height:28px;color:var(--muted)"></i><div style="font-weight:700;margin-top:8px">Ready to Level Up?</div><div class="muted" style="margin-top:4px">Every converted referral brings you closer to the next milestone.</div>'+
    '<button class="btn" style="width:100%;margin-top:10px" onclick="affTab=\'links\';render()">Copy Your Link</button></div>';
}
function renderAffLinks_(u){
  var link = window.location.href.split('?')[0] + '?ref=' + u.referralCode;
  return '<div class="promo-card"><div style="padding:12px"><div class="row"><b>Your Referral Link</b><span class="badge b-active">Earn '+affCurrentTier_(u).current.commissionPct+'%</span></div>'+
    '<input id="reflink" value="'+link+'" readonly></div>'+
    '<div class="copybar" onclick="shareVia(\'whatsapp\')">WhatsApp</div><div class="copybar" onclick="shareVia(\'twitter\')">Twitter</div><div class="copybar" onclick="shareVia(\'telegram\')">Telegram</div>'+
    '<div class="copybar" onclick="copyRef()"><b>Copy Link</b></div></div>';
}
function shareVia(platform){
  var u = currentUser();
  var link = window.location.href.split('?')[0] + '?ref=' + u.referralCode;
  var text = encodeURIComponent('Get funded with clear daily drawdown limits — use my link: ');
  var urls = {
    whatsapp:'https://wa.me/?text='+text+encodeURIComponent(link),
    twitter:'https://twitter.com/intent/tweet?text='+text+'&url='+encodeURIComponent(link),
    telegram:'https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+text
  };
  window.open(urls[platform], '_blank');
}
function renderAffReferrals_(referred){
  var rows = referred.slice().reverse().map(function(r){
    var spent = STATE.orders.filter(function(o){return o.userId===r.id && o.status==='confirmed';}).reduce(function(s,o){return s+o.amount;},0);
    return '<div class="card"><div class="row"><b>'+r.name+'</b><span class="badge '+(spent>0?'b-active':'b-pending')+'">'+(spent>0?'converted':'registered')+'</span></div>'+
      '<div class="muted" style="font-size:12px">'+new Date(r.createdAt).toLocaleDateString()+'</div>'+
      '<div class="kv" style="margin-top:6px">Total Spent <b>'+naira(spent)+'</b></div></div>';
  }).join('');
  return '<div class="row" style="margin-bottom:8px"><b>Referrals</b><span class="badge b-active">'+referred.length+' total</span></div>'+
    (rows || '<div class="card muted" style="text-align:center">No referrals yet — share your link to get started.</div>');
}
function renderAffEarnings_(u){
  var reqs = STATE.payoutRequests.filter(function(p){return p.userId===u.id && p.type==='affiliate';});
  var paid = reqs.filter(function(p){return p.status==='paid';}).reduce(function(s,p){return s+p.amount;},0);
  return '<div class="grid" style="margin-bottom:14px">'+
    '<div class="stat-mini"><div class="lbl">Total Earned</div><div class="val">'+naira(u.affiliateEarnings||0)+'</div></div>'+
    '<div class="stat-mini"><div class="lbl">Available</div><div class="val">'+naira(affiliateAvailable_(u.id))+'</div></div>'+
    '<div class="stat-mini"><div class="lbl">Paid Out</div><div class="val">'+naira(paid)+'</div></div></div>'+
    '<div class="card"><div class="row"><b>Commissions ('+affCurrentTier_(u).current.commissionPct+'%)</b></div>'+
    (reqs.length? reqs.map(function(r){return '<div class="kv">'+naira(r.amount)+' — <span class="badge '+(r.status==='paid'?'b-active':'b-pending')+'">'+r.status+'</span></div>';}).join('') : '<div class="muted" style="text-align:center;padding:14px 0">No commissions yet</div>')+'</div>'+
    '<div class="card"><div class="row"><b>Payouts</b><button class="btn small" onclick="go(\'payout\')">Withdraw</button></div></div>';
}
function renderAffToolkit_(){
  var items = STATE.settings.affiliateToolkit || [];
  return '<div class="card"><b>Affiliate Toolkit</b><div class="muted" style="margin-top:2px">Save & share these graphics on your socials</div></div>'+
    items.map(function(t){
      return '<div class="promo-card"><img src="'+t.url+'" alt=""><div style="padding:12px">'+(t.caption?'<div class="muted" style="margin-bottom:8px">'+t.caption+'</div>':'')+
        '<button class="btn ghost" style="width:100%" onclick="downloadToolkitImage(\''+t.id+'\')">Download Graphic</button></div></div>';
    }).join('');
}
function downloadToolkitImage(id){
  var t = (STATE.settings.affiliateToolkit||[]).find(function(x){return x.id===id;});
  if(!t) return;
  var a = document.createElement('a'); a.href=t.url; a.download='promo-graphic'; a.target='_blank';
  document.body.appendChild(a); a.click(); a.remove();
}
function copyRef(){ var el=document.getElementById('reflink'); el.select(); document.execCommand('copy'); toast('Link copied'); }
function copyText(str){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(str).then(function(){toast('Copied');}); }
  else { var ta=document.createElement('textarea'); ta.value=str; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('Copied'); }
}
function togglePw(id){
  var el = document.getElementById('pw_'+id);
  var icon = document.getElementById('pwIcon_'+id);
  if(!el) return;
  var shown = el.getAttribute('data-shown')==='1';
  if(shown){ el.textContent = '••••••••'; el.setAttribute('data-shown','0'); if(icon) icon.setAttribute('data-lucide','eye'); }
  else { el.textContent = el.getAttribute('data-pw'); el.setAttribute('data-shown','1'); if(icon) icon.setAttribute('data-lucide','eye-off'); }
  refreshIcons();
}

boot();
</script>
