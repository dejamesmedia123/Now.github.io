<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<title>Now Funded</title>
<style>
  :root{--bg:#0A0F1F;--bg2:#0d1428;--panel:rgba(255,255,255,0.045);--panel2:rgba(255,255,255,0.06);--line:rgba(255,255,255,0.09);--text:#eef2fa;--muted:#8b96b3;--accent:#3B82F6;--accent2:#10B981;--gold:#FBBF24;--danger:#ef4444;--warn:#f59e0b;--radius:18px;}
  [data-theme="light"]{--bg:#f4f6fb;--bg2:#eef1f8;--panel:rgba(10,20,40,0.04);--panel2:rgba(10,20,40,0.06);--line:rgba(10,20,40,0.12);--text:#0f1626;--muted:#5b6b8c;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg));color:var(--text);transition:background .3s,color .3s}
  a{color:inherit}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,15,31,0.7);backdrop-filter:blur(10px);z-index:10}
  [data-theme="light"] .nav{background:rgba(244,246,251,0.75)}
  .brand{font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:21px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .nav-links{display:flex;gap:14px;font-size:14px;flex-wrap:wrap;align-items:center}
  .nav-links span{cursor:pointer;color:var(--muted);transition:color .15s}
  .nav-links span:hover{color:var(--text)}
  .hamburger{display:none;cursor:pointer;font-size:20px}
  .theme-toggle{cursor:pointer;font-size:16px;opacity:.8}
  .wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px}
  .hero{text-align:center;padding:60px 20px;position:relative}
  .hero h1{font-size:36px;margin:0 0 10px;line-height:1.15}
  .hero p{color:var(--muted);max-width:600px;margin:0 auto 22px}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04150a;border:none;padding:12px 22px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(59,130,246,.25)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(59,130,246,.35)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
  .btn.ghost:hover{transform:none;background:var(--panel2)}
  .btn.danger{background:var(--danger);color:#fff;box-shadow:none}
  .btn.warn{background:var(--warn);color:#1a1200;box-shadow:none}
  .btn.small{padding:7px 13px;font-size:12px}
  .stats{display:flex;gap:30px;justify-content:center;margin:30px 0;flex-wrap:wrap}
  .stat b{font-size:28px;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
  .stat span{color:var(--muted);font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;backdrop-filter:blur(8px);transition:transform .18s,box-shadow .18s,border-color .18s;position:relative}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.28);border-color:rgba(59,130,246,.35)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .toggle{display:flex;justify-content:center;gap:8px;margin:20px 0;flex-wrap:wrap}
  .toggle button{padding:10px 18px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;transition:.15s}
  .toggle button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04150a;border-color:transparent;font-weight:700}
  .plan-h{font-weight:700;font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .plan-price{color:var(--accent);font-weight:800;font-size:19px;margin:6px 0}
  .popular-badge{position:absolute;top:-10px;right:14px;background:linear-gradient(135deg,var(--gold),#f59e0b);color:#1a1200;font-size:10px;font-weight:800;padding:3px 10px;border-radius:10px;letter-spacing:.03em}
  .rule{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;padding:4px 0;border-top:1px dashed var(--line)}
  input,select,textarea{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin-bottom:10px;font-size:14px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  .section-title{font-size:21px;font-weight:800;margin:40px 0 14px;text-align:center}
  .faq-q{cursor:pointer;font-weight:700;padding:10px 0;display:flex;justify-content:space-between}
  .faq-a{color:var(--muted);font-size:13px;padding-bottom:10px;display:none}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
  .b-active{background:#14532d;color:#86efac}
  .b-pending{background:#78350f;color:#fcd34d}
  .b-closed{background:#450a0a;color:#fca5a5}
  .b-funded{background:linear-gradient(135deg,#1e3a8a,#3B82F6);color:#dbeafe}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .muted{color:var(--muted);font-size:13px}
  .bell{position:relative;cursor:pointer}
  .dot{position:absolute;top:-4px;right:-6px;background:var(--danger);color:#fff;font-size:10px;border-radius:8px;padding:1px 5px}
  .msg{padding:10px;border-radius:10px;margin-bottom:12px;font-size:13px}
  .msg.ok{background:#14532d;color:#bbf7d0}
  .msg.err{background:#450a0a;color:#fecaca}
  .kv{font-size:13px;margin:4px 0;color:var(--muted)}
  .kv b{color:var(--text)}
  #notifPanel{position:absolute;right:20px;top:56px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;width:280px;max-height:340px;overflow:auto;display:none;padding:8px;z-index:20;transform:translateY(-8px);opacity:0;transition:transform .2s,opacity .2s}
  #notifPanel.open{display:block;transform:translateY(0);opacity:1}
  .toastbox{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center}
  .toast{background:var(--panel2);border:1px solid var(--line);padding:8px 16px;border-radius:20px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:toastin .2s ease-out}
  @keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .chat-fab{position:fixed;bottom:18px;right:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04150a;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:30;transition:transform .15s}
  .chat-fab:hover{transform:scale(1.06)}
  .chat-panel{position:fixed;bottom:80px;right:18px;width:280px;max-height:380px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;display:none;flex-direction:column;z-index:30;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .chat-msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
  .chat-msg{max-width:80%;padding:6px 10px;border-radius:10px;font-size:13px}
  .chat-msg.user{align-self:flex-end;background:var(--accent);color:#fff}
  .chat-msg.admin{align-self:flex-start;background:var(--panel2)}
  .chat-input{display:flex;border-top:1px solid var(--line)}
  .chat-input input{margin:0;border:none;border-radius:0}
  .progress{background:var(--panel2);border-radius:8px;height:8px;overflow:hidden;margin:6px 0}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
  .progress.warn i{background:var(--warn)}
  .progress.danger i{background:var(--danger)}
  .pw-meter{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:-4px 0 10px}
  .pw-meter i{display:block;height:100%;width:0%;transition:width .2s,background .2s}
  .skeleton{background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:var(--radius);height:80px;margin-bottom:14px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .fade-in{animation:fadein .3s ease-out}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @media (max-width:640px){
    .nav-links{display:none;position:absolute;top:56px;right:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;flex-direction:column;padding:10px;min-width:160px}
    .nav-links.open{display:flex}
    .hamburger{display:block}
    .btn{width:100%}
  }
  .bottombar{position:fixed;bottom:0;left:0;right:0;display:none;justify-content:space-around;align-items:center;background:rgba(10,15,31,0.85);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:40}
  [data-theme="light"] .bottombar{background:rgba(244,246,251,0.9)}
  .bottombar.show{display:flex}
  .bb-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);cursor:pointer;font-size:10px;flex:1;padding:4px 0;position:relative;transition:color .15s}
  .bb-item.active{color:var(--accent)}
  .bb-item .dot{top:-2px;right:calc(50% - 16px)}
  body.has-bottombar .wrap{padding-bottom:80px}
  body.has-bottombar .chat-fab{bottom:74px}
  body.has-bottombar .chat-panel{bottom:136px}
</style>
</head>

<div class="nav">

function toggleTheme(){
  var isLight = document.documentElement.getAttribute('data-theme')==='light';
  document.documentElement.setAttribute('data-theme', isLight?'':'light');
  document.getElementById('themeBtn').textContent = isLight?'🌙':'☀️';
}
function toggleMenu(){
  menuOpen = !menuOpen;
  document.getElementById('navLinks').classList.toggle('open', menuOpen);
}
function refreshIcons(){ if(window.lucide) lucide.createIcons(); }

function boot(){
  fetch(WEBAPP_URL + '?action=read')
    .then(function(r){ return r.json(); })
    .then(function(data){
      STATE = (typeof data === 'string') ? JSON.parse(data) : data;
      seedIfEmpty();
      renderNav();
      route();
    })
    .catch(function(err){ document.getElementById('app').innerHTML = '<div class="card">Could not reach backend. Check WEBAPP_URL. '+err+'</div>'; });
}
// Content-Type: text/plain avoids a CORS preflight (Apps Script can't answer OPTIONS requests).
function save(cb){
  fetch(WEBAPP_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(STATE) })
    .then(function(){ if(cb) cb(); })
    .catch(function(err){ alert('Save failed: '+err); });
}
function seedIfEmpty(){
  if(!STATE.drawdownTypes.length) return; // backend already seeds defaults
  if(planFilterDD===null) planFilterDD = STATE.drawdownTypes[0].id;
  // Backfill arrays/fields for state saved before these features existed.
  if(!STATE.chatMessages) STATE.chatMessages = [];
  STATE.users.forEach(function(u){ if(u.kycStatus===undefined) u.kycStatus='none'; if(u.kycCountry===undefined) u.kycCountry=''; if(u.kycIdNumber===undefined) u.kycIdNumber=''; if(u.referralDiscountUsed===undefined) u.referralDiscountUsed=false; });
  if(!STATE.settings.avatarLibrary || !STATE.settings.avatarLibrary.length) STATE.settings.avatarLibrary = DEFAULT_AVATARS;
  STATE.users.forEach(function(u){ if(u.avatarUrl===undefined) u.avatarUrl=''; });
}
function toast(text){
  var box = document.getElementById('toastbox');
  var t = document.createElement('div'); t.className='toast'; t.textContent=text;
  box.appendChild(t); setTimeout(function(){ t.remove(); }, 3000);
}
// ---- Live chat (stored as STATE.chatMessages, polled on save; no true real-time push) ----
function toggleChat(){
  var p = document.getElementById('chatPanel');
  var open = p.style.display==='flex';
  p.style.display = open ? 'none' : 'flex';
  if(!open) renderChat();
}
function renderChat(){
  var mine = STATE.chatMessages.filter(function(m){return m.userId===currentUserId;});
  document.getElementById('chatMsgs').innerHTML = mine.map(function(m){return '<div class="chat-msg '+m.sender+'">'+m.text+'</div>';}).join('') || '<div class="muted" style="font-size:12px">Ask us anything — an admin will reply here.</div>';
  var hadUnread = mine.some(function(m){return m.sender==='admin' && !m.read;});
  mine.forEach(function(m){ if(m.sender==='admin') m.read=true; });
  if(hadUnread) save(function(){ renderNav(); });
}
function sendChat(){
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if(!text) return;
  STATE.chatMessages.push({id:uid('cm'),userId:currentUserId,sender:'user',text:text,read:false,createdAt:new Date().toISOString()});
  input.value='';
  save(function(){ renderChat(); toast('Message sent'); });
}
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function naira(n){ return '₦'+Number(n||0).toLocaleString(); }
function go(v){ view=v; render(); }
function currentUser(){ return STATE.users.find(function(u){return u.id===currentUserId;}); }

var bbItems = [
  {view:'dashboard', label:'Home', icon:'home'},
  {view:'checkout', label:'Challenges', icon:'trophy'},
  {view:'payout', label:'Payout', icon:'wallet'},
  {view:'affiliate', label:'Affiliate', icon:'users'}
];
function renderNav(){
  var html = '';
  if(currentUserId){
    html = '<span onclick="nav(\'Logout\')">Logout</span>';
  } else {
    html = ['Login','Sign Up'].map(function(l){return '<span onclick="nav(\''+l+'\')">'+l+'</span>';}).join('');
  }
  if(currentUserId){
    var n = STATE.notifications.filter(function(x){return x.userId===currentUserId && !x.read;}).length;
    html += '<span class="bell" onclick="toggleNotif()">🔔'+(n?'<span class="dot">'+n+'</span>':'')+'</span>';
  }
  document.getElementById('navLinks').innerHTML = html;

  // Bottom app bar replaces a sidebar for logged-in users — same nav, phone-app style.
  var bar = document.getElementById('bottomBar');
  if(currentUserId){
    document.body.classList.add('has-bottombar');
    bar.classList.add('show');
    bar.innerHTML = bbItems.map(function(it){
      return '<div class="bb-item '+(view===it.view?'active':'')+'" onclick="go(\''+it.view+'\')">'+
        '<i data-lucide="'+it.icon+'" style="width:20px;height:20px"></i><span>'+it.label+'</span></div>';
    }).join('');
  } else {
    document.body.classList.remove('has-bottombar');
    bar.classList.remove('show');
    bar.innerHTML = '';
  }
  var fab = document.getElementById('chatFab');
  if(currentUserId){
    fab.style.display='flex';
    var unread = STATE.chatMessages.filter(function(m){return m.userId===currentUserId && m.sender==='admin' && !m.read;}).length;
    fab.innerHTML = '💬' + (unread? '<span class="dot" style="top:-2px;right:-2px">'+unread+'</span>':'');
  } else { fab.style.display='none'; document.getElementById('chatPanel').style.display='none'; }
}
function nav(l){
  menuOpen=false; var nl=document.getElementById('navLinks'); if(nl) nl.classList.remove('open');
  if(l==='Logout'){ currentUserId=null; go('index'); return; }
  if(l==='Sign Up') return go('signup');
  go(l.toLowerCase());
}
function toggleNotif(){
  var p = document.getElementById('notifPanel');
  if(p.classList.contains('open')){ p.classList.remove('open'); return; }
  var mine = STATE.notifications.filter(function(x){return x.userId===currentUserId;}).slice().reverse();
  p.innerHTML = mine.length ? mine.map(function(n){return '<div class="card" style="margin-bottom:6px;padding:8px"><div style="font-size:12px">'+n.message+'</div></div>';}).join('') : '<div class="muted" style="padding:10px">No notifications</div>';
  mine.forEach(function(n){n.read=true;});
  renderNav(); save();
  p.classList.add('open');
}
function notify(userId,message){
  STATE.notifications.push({id:uid('nt'),userId:userId,message:message,read:false,createdAt:new Date().toISOString()});
}
function route(){ render(); }

function render(){
  renderNav();
  var el = document.getElementById('app');
  el.classList.remove('fade-in'); void el.offsetWidth; el.classList.add('fade-in');
  if(view==='index') el.innerHTML = renderIndex();
  else if(view==='signup') el.innerHTML = renderSignup();
  else if(view==='login') el.innerHTML = renderLogin();
  else if(view==='dashboard') el.innerHTML = renderDashboard();
  else if(view==='checkout') el.innerHTML = renderCheckout();
  else if(view==='payout') el.innerHTML = renderPayout();
  else if(view==='affiliate') el.innerHTML = renderAffiliate();
  refreshIcons();
  if(view==='index') animateCounters();
}
function animateCounters(){
  document.querySelectorAll('.stat b[data-count]').forEach(function(el){
    var target = Number(el.getAttribute('data-count'));
    var start = 0, steps=30, i=0;
    var timer = setInterval(function(){
      i++; start = Math.round(target * (i/steps));
      el.textContent = el.getAttribute('data-prefix') + start.toLocaleString();
      if(i>=steps){ clearInterval(timer); el.textContent = el.getAttribute('data-prefix') + target.toLocaleString(); }
    }, 20);
  });
}

function renderSignup(){
  var lib = (STATE.settings.avatarLibrary && STATE.settings.avatarLibrary.length) ? STATE.settings.avatarLibrary : DEFAULT_AVATARS;
  if(suAvatar===null && lib.length) suAvatar = lib[0].id;
  var avatarGrid = lib.map(function(a){
    var sel = a.id===suAvatar;
    return '<img src="'+a.url+'" data-avatar-id="'+a.id+'" onclick="pickAvatar(\''+a.id+'\')" class="avatar-opt" style="width:52px;height:52px;border-radius:50%;object-fit:cover;cursor:pointer;margin:4px;border:2px solid '+(sel?'var(--accent)':'transparent')+'">';
  }).join('');
  return '<div class="card" style="max-width:380px;margin:0 auto"><h2>Sign Up</h2><div id="msg"></div>'+
    '<label>Choose a profile icon</label>'+
    '<div id="avatarPicker" style="display:flex;flex-wrap:wrap">'+avatarGrid+'</div>'+
    '<label>Name</label><input id="su_name"><label>Email</label><input id="su_email">'+
    '<label>Password</label><input id="su_pass" type="password" oninput="updatePwMeter()">'+
    '<div class="pw-meter"><i id="pwbar"></i></div>'+
    '<button class="btn" style="width:100%" onclick="doSignup()">Create Account</button>'+
    '<p class="muted" style="margin-top:10px">Have an account? <a style="color:var(--accent);cursor:pointer" onclick="go(\'login\')">Log in</a></p></div>';
}
function pickAvatar(id){
  suAvatar = id;
  var opts = document.querySelectorAll('#avatarPicker .avatar-opt');
  opts.forEach(function(im){ im.style.borderColor = (im.getAttribute('data-avatar-id')===id) ? 'var(--accent)' : 'transparent'; });
}
function updatePwMeter(){
  var v = document.getElementById('su_pass').value;
  var score = 0;
  if(v.length>=6) score++;
  if(v.length>=10) score++;
  if(/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v)) score++;
  var pct = [0,25,50,75,100][score];
  var color = ['#ef4444','#ef4444','#f59e0b','#3B82F6','#10B981'][score];
  var bar = document.getElementById('pwbar');
  bar.style.width = pct+'%'; bar.style.background = color;
}
function doSignup(){
  var name=document.getElementById('su_name').value.trim();
  var email=document.getElementById('su_email').value.trim().toLowerCase();
  var pass=document.getElementById('su_pass').value;
  if(!name||!email||!pass) return msg('Fill all fields','err');
  if(STATE.users.find(function(u){return u.email===email;})) return msg('Email already registered','err');
  var refCode = getRefFromUrl();
  var referredBy = refCode ? (STATE.users.find(function(u){return u.referralCode===refCode;})||{}).id : null;
  var lib = (STATE.settings.avatarLibrary && STATE.settings.avatarLibrary.length) ? STATE.settings.avatarLibrary : DEFAULT_AVATARS;
  var chosenAvatar = lib.find(function(a){return a.id===suAvatar;});
  var u = {id:uid('u'),name:name,email:email,password:pass,avatarUrl:(chosenAvatar?chosenAvatar.url:''),referralCode:uid('ref').slice(0,10),referredBy:referredBy||null,affiliateEarnings:0,
    referralDiscountUsed:false,kycStatus:'none',kycCountry:'',kycIdNumber:'',createdAt:new Date().toISOString()};
  STATE.users.push(u);
  currentUserId = u.id;
  suAvatar = null;
  save(function(){ go(pendingPlan?'checkout':'dashboard'); });
}
function renderLogin(){
  return '<div class="card" style="max-width:380px;margin:0 auto"><h2>Login</h2><div id="msg"></div>'+
    '<label>Email</label><input id="li_email"><label>Password</label><input id="li_pass" type="password">'+
    '<button class="btn" style="width:100%" onclick="doLogin()">Login</button></div>';
}
function doLogin(){
  var email=document.getElementById('li_email').value.trim().toLowerCase();
  var pass=document.getElementById('li_pass').value;
  var u = STATE.users.find(function(u){return u.email===email && u.password===pass;});
  if(!u) return msg('Invalid credentials','err');
  currentUserId = u.id;
  go('dashboard');
}
function msg(t,cls){ var m=document.getElementById('msg'); if(m) m.innerHTML='<div class="msg '+cls+'">'+t+'</div>'; }

// ---------- DASHBOARD ----------
function renderDashboard(){
  if(!currentUserId) return renderLogin();
  var me = currentUser();
  var avatarSrc = me.avatarUrl || ('https://ui-avatars.com/api/?name='+encodeURIComponent(me.name)+'&background=10B981&color=fff&rounded=true&size=48');
  var lib = (STATE.settings.avatarLibrary && STATE.settings.avatarLibrary.length) ? STATE.settings.avatarLibrary : DEFAULT_AVATARS;
  var header = '<div class="row card" style="align-items:center;gap:12px"><img src="'+avatarSrc+'" style="width:48px;height:48px;border-radius:50%;object-fit:cover">'+
    '<div style="flex:1"><b>'+me.name+'</b><div class="muted">'+me.email+'</div></div>'+
    '<button class="btn ghost small" onclick="toggleAvatarPicker()">Change Icon</button></div>'+
    '<div id="dashAvatarPicker" class="card" style="display:none">'+lib.map(function(a){
      return '<img src="'+a.url+'" onclick="updateAvatar(\''+a.id+'\')" style="width:52px;height:52px;border-radius:50%;object-fit:cover;cursor:pointer;margin:4px;border:2px solid '+(me.avatarUrl===a.url?'var(--accent)':'transparent')+'">';
    }).join('')+'</div>';
  var myAccounts = STATE.traderAccounts.filter(function(a){return a.userId===currentUserId;});
  var myOrders = STATE.orders.filter(function(o){return o.userId===currentUserId;});
  var accHtml = myAccounts.length ? myAccounts.map(function(a){
    var badge = a.status==='closed' ? '<span class="badge b-closed">Closed ('+a.reason+')</span>' : a.stage==='funded' ? '<span class="badge b-funded">Funded</span>' : '<span class="badge b-active">Active — '+a.stage+'</span>';
    var certs = STATE.certificates.filter(function(c){return c.traderAccountId===a.id;});
    var profitPct = a.startBalance ? ((a.currentBalance-a.startBalance)/a.startBalance*100) : 0;
    var progressHtml = '';
    if(a.status!=='closed' && a.profitTargetPct){
      var pctOfTarget = Math.max(0,Math.min(100, (profitPct/a.profitTargetPct)*100));
      progressHtml += '<div class="kv">Challenge Progress '+profitPct.toFixed(1)+'% / '+a.profitTargetPct+'% target</div><div class="progress"><i style="width:'+pctOfTarget+'%"></i></div>';
    }
    if(a.status!=='closed' && a.maxDrawdownPct){
      var lossPct = a.startBalance ? Math.max(0,(a.startBalance-Math.min(a.currentBalance,a.equity))/a.startBalance*100) : 0;
      var ddUsed = Math.min(100, (lossPct/a.maxDrawdownPct)*100);
      var ddClass = ddUsed>75?'danger':ddUsed>40?'warn':'';
      progressHtml += '<div class="kv">Drawdown Used '+lossPct.toFixed(1)+'% / '+a.maxDrawdownPct+'% max</div><div class="progress '+ddClass+'"><i style="width:'+ddUsed+'%"></i></div>';
    }
    return '<div class="card"><div class="row"><b>'+a.category+'</b>'+badge+'</div>'+
      (a.status!=='closed'? '<div class="kv">Login: <b>'+a.login+'</b> · Server: <b>'+a.server+'</b> · Password: <b>'+a.password+'</b></div>':'<div class="muted">Credentials revoked — account closed.</div>')+
      '<div class="kv">Balance: <b>'+naira(a.currentBalance)+'</b> · Equity: <b>'+naira(a.equity)+'</b></div>'+
      progressHtml + equityCurveSvg(a.balanceHistory) +
      (certs.length? '<div class="kv">Certificates: '+certs.map(function(c){return c.type;}).join(', ')+'</div>':'')+
      (a.status==='closed'? '<button class="btn small danger" onclick="deleteAccount(\''+a.id+'\')">Delete</button>':'')+
      '</div>';
  }).join('') : '<div class="card muted">No accounts yet. <a style="color:#22c55e;cursor:pointer" onclick="go(\'checkout\')">Buy a challenge</a></div>';
  var ordHtml = myOrders.map(function(o){
    return '<div class="kv">Order '+o.orderCode+' — '+naira(o.amount)+' — <span class="badge b-'+o.status+'">'+o.status+'</span></div>';
  }).join('');
  var u = currentUser();
  var kycHtml = '<div class="card"><div class="row"><b>KYC Verification</b><span class="badge '+(u.kycStatus==='approved'?'b-active':u.kycStatus==='pending'?'b-pending':'b-closed')+'">'+u.kycStatus+'</span></div>'+
    (u.kycStatus==='approved' ? '<div class="muted">Verified.</div>' :
    '<label>Country</label><input id="kyc_country" value="'+u.kycCountry+'"><label>ID Number</label><input id="kyc_id" value="'+u.kycIdNumber+'">'+
    '<div class="muted" style="margin:6px 0">Document/selfie upload isn\'t supported yet — submit your details and an admin will follow up on how to verify.</div>'+
    '<button class="btn small" onclick="submitKyc()">Submit for Review</button>')+'</div>';
  return header+'<h2>Dashboard</h2><h4>Your Accounts</h4>'+accHtml+(ordHtml?'<h4>Orders</h4><div class="card">'+ordHtml+'</div>':'')+'<h4>Verification</h4>'+kycHtml;
}
function submitKyc(){
  var u = currentUser();
  u.kycCountry = document.getElementById('kyc_country').value.trim();
  u.kycIdNumber = document.getElementById('kyc_id').value.trim();
  u.kycStatus = 'pending';
  save(function(){ toast('Submitted for review'); render(); });
}
function toggleAvatarPicker(){
  var p = document.getElementById('dashAvatarPicker');
  if(!p) return;
  p.style.display = (p.style.display==='none') ? 'flex' : 'none';
}
function updateAvatar(id){
  var lib = (STATE.settings.avatarLibrary && STATE.settings.avatarLibrary.length) ? STATE.settings.avatarLibrary : DEFAULT_AVATARS;
  var a = lib.find(function(x){return x.id===id;});
  if(!a) return;
  var u = currentUser();
  u.avatarUrl = a.url;
  save(function(){ toast('Profile icon updated'); render(); });
}
function equityCurveSvg(history){
  if(!history || history.length<2) return '';
  var vals = history.map(function(h){return h.equity;});
  var min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
  var range = (max-min)||1;
  var w=260,h=50;
  var pts = vals.map(function(v,i){ var x=(i/(vals.length-1))*w; var y=h-((v-min)/range)*h; return x+','+y; }).join(' ');
  return '<div class="kv" style="margin-top:6px">Equity History</div><svg width="'+w+'" height="'+h+'" style="display:block"><polyline points="'+pts+'" fill="none" stroke="#22c55e" stroke-width="2"/></svg>';
}
function deleteAccount(id){
  STATE.traderAccounts = STATE.traderAccounts.filter(function(a){return a.id!==id;});
  save(function(){ render(); });
}

// ---------- CHECKOUT ----------
function renderCheckout(){
  if(!currentUserId) return renderLogin();
  var plan = STATE.plans.find(function(p){return p.id===pendingPlan;}) || STATE.plans[0];
  if(!plan) return '<div class="card">No plans available yet.</div>';
  var options = STATE.plans.map(function(p){return '<option value="'+p.id+'" '+(p.id===plan.id?'selected':'')+'>'+p.name+' — '+naira(p.price)+'</option>';}).join('');
  var b = STATE.settings.bank;
  var u = currentUser();
  var refNote = (u.referredBy && !u.referralDiscountUsed) ? '<div class="kv" style="color:var(--accent2)">You qualify for a '+STATE.settings.affiliateDiscountRate+'% first-order referral discount — applied automatically unless you use a code below.</div>' : '';
  return '<h2>Checkout</h2><div id="msg"></div><div class="card">'+
    '<label>Plan</label><select id="co_plan" onchange="pendingPlan=this.value;render()">'+options+'</select>'+
    refNote+
    '<label>Discount Code (optional)</label><input id="co_code" placeholder="Leave blank to use referral discount if eligible">'+
    '<div class="kv">Amount: <b id="co_amount">'+naira(plan.price)+'</b></div>'+
    '<h4>Pay via Bank Transfer</h4><div class="kv">Bank: <b>'+(b.name||'-')+'</b></div><div class="kv">Account Number: <b>'+(b.accountNumber||'-')+'</b></div>'+
    '<div class="kv">Account Name: <b>'+(b.accountName||'-')+'</b></div><div class="muted">'+b.instructions+'</div>'+
    '<button class="btn" style="width:100%;margin-top:10px" onclick="submitOrder(\''+plan.id+'\')">I\'ve Paid — Submit Order</button></div>';
}
function submitOrder(planId){
  var plan = STATE.plans.find(function(p){return p.id===document.getElementById('co_plan').value;}) || STATE.plans.find(function(p){return p.id===planId;});
  var code = document.getElementById('co_code').value.trim();
  var user = currentUser();
  var amount = plan.price;
  var usedDiscountCode = null;
  if(code){
    var dc = STATE.discountCodes.find(function(d){return d.code===code && d.active;});
    if(!dc) return msg('Invalid or inactive code','err');
    if(dc.expiryDate && new Date(dc.expiryDate) < new Date()) return msg('Code expired','err');
    if(dc.usedCount >= dc.usageLimit) return msg('Code usage limit reached','err');
    if(dc.scope!=='all' && dc.scope.indexOf(plan.id)===-1) return msg('Code not valid for this plan','err');
    amount = dc.type==='percent' ? amount - (amount*dc.value/100) : Math.max(0,amount-dc.value);
    dc.usedCount++; usedDiscountCode = dc.code;
  } else if(user.referredBy && !user.referralDiscountUsed){
    amount = amount - (amount*STATE.settings.affiliateDiscountRate/100);
    user.referralDiscountUsed = true;
  }
  var order = {id:uid('o'),orderCode:uid('NF').toUpperCase().slice(0,8),userId:currentUserId,planId:plan.id,amount:Math.round(amount),discountCode:usedDiscountCode,status:'pending',createdAt:new Date().toISOString()};
  STATE.orders.push(order);
  save(function(){ msg('Order submitted! Order code: '+order.orderCode+'. Awaiting admin confirmation.','ok'); });
}

// ---------- PAYOUT ----------
function renderPayout(){
  if(!currentUserId) return renderLogin();
  var u = currentUser();
  var funded = STATE.traderAccounts.filter(function(a){return a.userId===currentUserId && a.stage==='funded' && a.status!=='closed';});
  var reqs = STATE.payoutRequests.filter(function(p){return p.userId===currentUserId;});
  return '<h2>Payout</h2><div id="msg"></div><div class="card">'+
    '<div class="kv">Affiliate earnings available: <b>'+naira(u.affiliateEarnings)+'</b></div>'+
    '<label>Type</label><select id="po_type"><option value="trader">Funded Account Profit Share</option><option value="affiliate">Affiliate Commission</option></select>'+
    '<label>Amount (₦)</label><input id="po_amount" type="number">'+
    '<label>Bank Details</label><input id="po_bank" placeholder="Bank / Account Number / Name">'+
    '<button class="btn" style="width:100%" onclick="submitPayout()">Request Payout</button></div>'+
    (reqs.length? '<h4>History</h4><div class="card">'+reqs.map(function(r){return '<div class="kv">'+r.type+' — '+naira(r.amount)+' — <span class="badge b-'+r.status+'">'+r.status+'</span></div>';}).join('')+'</div>':'');
}
function submitPayout(){
  var type=document.getElementById('po_type').value;
  var amount=Number(document.getElementById('po_amount').value);
  var bank=document.getElementById('po_bank').value.trim();
  var min = type==='affiliate' ? STATE.settings.minAffiliatePayout : STATE.settings.minPayout;
  if(!amount || amount<min) return msg('Minimum payout is '+naira(min),'err');
  if(!bank) return msg('Enter bank details','err');
  var u = currentUser();
  if(type==='affiliate'){
    if(amount > u.affiliateEarnings) return msg('Amount exceeds your available affiliate earnings','err');
    u.affiliateEarnings -= amount; // reserve immediately so the same balance can't be requested twice
  }
  STATE.payoutRequests.push({id:uid('po'),userId:currentUserId,type:type,amount:amount,bankDetails:bank,status:'pending',createdAt:new Date().toISOString()});
  save(function(){ msg('Payout request submitted.','ok'); render(); });
}

// ---------- AFFILIATE ----------
function renderAffiliate(){
  if(!currentUserId) return renderLogin();
  var u = currentUser();
  var link = window.location.href.split('?')[0] + '?ref=' + u.referralCode;
  var referred = STATE.users.filter(function(x){return x.referredBy===u.id;});
  return '<h2>Affiliate</h2><div class="card"><div class="kv">Your referral link:</div>'+
    '<input id="reflink" value="'+link+'" readonly><button class="btn small" onclick="copyRef()">Copy Link</button>'+
    '<div class="kv" style="margin-top:10px">Referrals gain '+STATE.settings.affiliateDiscountRate+'% off automatically. You earn '+STATE.settings.affiliateCommissionRate+'% commission on their payouts.</div>'+
    '<div class="kv">Total referred users: <b>'+referred.length+'</b></div>'+
    '<div class="kv">Available earnings: <b>'+naira(u.affiliateEarnings)+'</b></div></div>';
}
function copyRef(){ var el=document.getElementById('reflink'); el.select(); document.execCommand('copy'); msg&&msg('Link copied','ok'); }

boot();
</script>
