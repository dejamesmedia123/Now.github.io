<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Now Funded — Admin</title>
<style>
  :root{--bg:#0A0E13;--bg2:#0F1721;--panel:rgba(255,255,255,0.05);--panel2:rgba(255,255,255,0.09);--line:rgba(255,255,255,0.14);--text:#F2F5F8;--muted:#8D9AAC;--accent:#1FD8A6;--accent2:#3FA9F5;--gold:#F5B942;--danger:#FF6B6B;--warn:#F5B942;--btn-text:#03130E;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg));color:var(--text)}
  .nav{display:flex;gap:12px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,14,19,0.7);backdrop-filter:blur(10px);z-index:10}
  .nav span{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 10px;border-radius:8px;transition:.15s;white-space:nowrap;flex-shrink:0}
  .nav span.active,.nav span:hover{color:var(--accent);background:var(--panel2)}
  .wrap{max-width:1000px;margin:0 auto;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;backdrop-filter:blur(8px);overflow-x:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  input,select,textarea{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin-bottom:8px;font-size:13px}
  label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--btn-text);border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
  .btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
  .btn.warn{background:var(--panel2);border:1px solid var(--gold);color:var(--gold)}
  .btn.small{padding:5px 10px;font-size:12px}
  table{width:100%;min-width:480px;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;border:1px solid var(--line)}
  .b-pending{background:transparent;color:var(--gold);border:1px dashed var(--gold)}
  .b-confirmed{background:var(--accent);color:var(--btn-text);border-color:transparent}
  .b-rejected,.b-closed{background:transparent;color:var(--muted);border:1px solid var(--line);text-decoration:line-through}
  .alert{background:rgba(255,107,107,.12);color:var(--danger);border:1px solid var(--danger);padding:10px;border-radius:10px;margin-bottom:10px;font-size:13px}
  .muted{color:var(--muted);font-size:12px}
  .kv{font-size:13px;margin:4px 0;color:var(--muted)}
  .kv b{color:var(--text)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  h2{margin-top:0}
  textarea.rawjson{font-family:monospace;font-size:12px;min-height:260px}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:560px){
    .wrap{padding:12px}
    .card{padding:12px;border-radius:12px}
    .field-row{grid-template-columns:1fr}
    input,select,textarea{font-size:16px} /* prevents iOS Safari auto-zoom on focus */
    .btn{padding:10px 14px}
  }
</style>
</head>
<body>
<div class="nav" id="nav"></div>
<div class="wrap" id="app">Loading...</div>
<script>
// PASTE YOUR DEPLOYED APPS SCRIPT WEB APP URL HERE (ends in /exec) — same URL as App.html uses
var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwrtEit40wugkoqeu4RBm0xJmE7ow1oRidK-jHfdvdTAcKF1O9svkbCXFb87Wa1C8tTqQ/exec';
// Separate Apps Script project/deployment — just sends email, shares nothing with WEBAPP_URL.
// Paste the /exec URL from deploying email.gs as its own web app.
var EMAIL_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzYVMNktyZHhBB1tHozbjLR8yjDIhh807DQThcV8-ms3dLqATpk7WN10wTPPcLzPE3f/exec';

var STATE=null, tab='orders', gateOk=false;
function boot(){
  fetch(WEBAPP_URL + '?action=read')
    .then(function(r){ return r.json(); })
    .then(function(data){
      STATE = (typeof data === 'string') ? JSON.parse(data) : data;
      knownVersion = STATE._version || 0; // track what we last read, for optimistic-save checks
      // Persistent login: if a previously-entered code is saved and still
      // matches the current access code, skip the gate. Storing the code
      // itself (not just a boolean) means changing the access code in
      // Settings automatically signs out any stale sessions.
      try{
        var savedCode = localStorage.getItem('nf_admin_code');
        if(savedCode && STATE.settings && savedCode === STATE.settings.accessCode) gateOk = true;
      }catch(e){}
      render();
    })
    .catch(function(err){ document.getElementById('app').innerHTML = '<div class="card">Could not reach backend. Check WEBAPP_URL. '+err+'</div>'; });
}
var knownVersion = 0; // version of STATE as last read from the backend
// Content-Type: text/plain avoids a CORS preflight (Apps Script can't answer OPTIONS requests).
// Sends the version STATE was last read at as _expectedVersion. If the backend's
// Timekeeper library isn't attached yet, it just ignores that field and overwrites
// as before — this call is safe either way.
function save(cb){
  STATE._expectedVersion = knownVersion;
  fetch(WEBAPP_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(STATE) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.conflict){
        // Someone else saved in between (another admin tab, or the live site
        // writing an order/payout). Don't silently clobber their change —
        // reload the current state and ask the user to redo their edit.
        delete STATE._expectedVersion;
        return fetch(WEBAPP_URL + '?action=read').then(function(r){ return r.json(); }).then(function(data){
          STATE = (typeof data === 'string') ? JSON.parse(data) : data;
          knownVersion = STATE._version || 0;
          alert('Something went wrong saving. The page has been refreshed — please try again.');
          render();
        });
      }
      delete STATE._expectedVersion;
      if(res && typeof res.version === 'number') knownVersion = res.version;
      if(cb) cb();
      render();
    })
    .catch(function(err){ delete STATE._expectedVersion; alert('Save failed: '+err); });
}
// ---- AUTO-RETRYING SAVE (for narrow, self-contained actions) ----
// Use this instead of save() for actions that just look up a record by id and
// mutate it (confirm/reject/approve/deny/add/etc). On a version conflict, the
// write never persisted server-side — there's nothing of ours to lose — so we
// silently refetch the latest data and re-run the SAME action closure against
// it, rather than bothering the person with "please try again". This only
// works because actionFn re-looks-up everything it needs from the live STATE
// each time it runs, instead of closing over stale references.
// actionFn can return false to abort (e.g. a real precondition failed, like
// "no login of this size left" — it should alert/message the user itself
// before returning false); anything else proceeds to save.
var SAVE_ACTION_MAX_RETRIES = 3;
function saveAction(actionFn, cb, attempt){
  attempt = attempt || 0;
  if(actionFn() === false){ render(); return; }
  STATE._expectedVersion = knownVersion;
  fetch(WEBAPP_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(STATE) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.conflict){
        delete STATE._expectedVersion;
        return fetch(WEBAPP_URL + '?action=read').then(function(r){ return r.json(); }).then(function(data){
          STATE = (typeof data === 'string') ? JSON.parse(data) : data;
          knownVersion = STATE._version || 0;
          if(attempt >= SAVE_ACTION_MAX_RETRIES){
            // Real hot contention (rare) — give up retrying quietly and say so.
            render();
            alert('Something went wrong saving. The page has been refreshed — please try again.');
            return;
          }
          saveAction(actionFn, cb, attempt+1);
        });
      }
      delete STATE._expectedVersion;
      if(res && typeof res.version === 'number') knownVersion = res.version;
      if(cb) cb();
      render();
    })
    .catch(function(err){ delete STATE._expectedVersion; alert('Save failed: '+err); });
}
// Fire-and-forget email relay — mirrors App.html's sendMail(). Admin builds the message,
// backend (email.gs) just sends it. Never blocks/alerts on failure.
function sendMail(to, subject, body){
  if(!STATE.settings.emailNotificationsEnabled) return;
  if(!to || !subject || !body) return;
  fetch(EMAIL_WEBAPP_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ to: to, subject: subject, body: body })
  }).catch(function(err){ console.warn('Email send failed:', err); });
}
function userEmail_(userId){ var u = STATE.users.find(function(x){return x.id===userId;}); return u ? u.email : ''; }
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function naira(n){ return '₦'+Number(n||0).toLocaleString(); }
function sizeLabel_(n){ return Number(n||0).toLocaleString(); } // account size, e.g. "200,000" — not currency
// Builds a CSV file client-side and triggers a browser download — no backend involved.
function exportCsv_(filename, headers, rows){
  var esc = function(v){
    v = (v===null || v===undefined) ? '' : String(v);
    if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
    return v;
  };
  var lines = [headers.map(esc).join(',')].concat(rows.map(function(r){ return r.map(esc).join(','); }));
  var csv = lines.join('\r\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

// ---- BNPL (Buy Now Pay Later) display helpers ----
// Same fixed 40/60 upfront/balance split used in App.html's checkout —
// display-only here, admin marks the balance as received off-app for now.
var BNPL_UPFRONT_PCT = 0.40;
function isBNPL_(plan){ return !!plan && plan.planTypeId === 'pt_bnpl'; }
function bnplSplit_(plan){
  var upfront = Math.round((plan && plan.price||0) * BNPL_UPFRONT_PCT);
  return { upfront: upfront, balance: ((plan && plan.price)||0) - upfront };
}
function log(action,details){ STATE.activityLog.push({id:uid('lg'),actor:'admin',action:action,details:details,createdAt:new Date().toISOString()}); }
// Tier lookup, mirroring App.html's version — needed here too since commission is
// actually credited in confirmOrder(), which lives in this file.
function affReferredConverted_(u){
  return STATE.users.filter(function(x){return x.referredBy===u.id;}).filter(function(x){
    return STATE.orders.some(function(o){return o.userId===x.id && o.status==='confirmed';});
  }).length;
}
function affCurrentTier_(u){
  var tiers = (STATE.settings.affiliateTiers||[]).slice().sort(function(a,b){return a.minReferrals-b.minReferrals;});
  var converted = affReferredConverted_(u);
  var current = tiers[0], next = null;
  tiers.forEach(function(t){ if(converted>=t.minReferrals) current=t; });
  for(var i=0;i<tiers.length;i++){ if(tiers[i].minReferrals>converted){ next=tiers[i]; break; } }
  return {tiers:tiers, current:current||{name:'Affiliate Starter',commissionPct:15}, next:next, converted:converted};
}

function render(){
  if(!gateOk) return renderGate();
  if(!STATE.chatMessages) STATE.chatMessages = [];
  if(!STATE.supportTickets) STATE.supportTickets = [];
  STATE.users.forEach(function(u){ if(u.kycStatus===undefined) u.kycStatus='none'; if(u.kycCountry===undefined) u.kycCountry=''; if(u.kycIdNumber===undefined) u.kycIdNumber=''; if(u.bookStage===undefined) u.bookStage='bbook'; });
  if(STATE.settings.referralDiscountScope===undefined) STATE.settings.referralDiscountScope='every';
  if(STATE.settings.profitSplitPct===undefined) STATE.settings.profitSplitPct=80;
  if(STATE.settings.adminEmail===undefined) STATE.settings.adminEmail='';
  if(STATE.settings.emailNotificationsEnabled===undefined) STATE.settings.emailNotificationsEnabled=true;
  if(!STATE.settings.flutterwave) STATE.settings.flutterwave = {enabled:false, publicKey:'', verifyUrl:''};
  if(!STATE.settings.seo) STATE.settings.seo = {
    title: 'Now Funded — Get Funded. Trade With Clear Daily Limits.',
    description: 'Pass a Now Funded trading challenge and get a funded MT5 account with clear end-of-day drawdown limits, instant funding options, and fast payouts.',
    keywords: 'prop firm, funded trading account, forex challenge, MT5 funding, get funded to trade',
    ogImage: '',
    favicon: '',
    canonicalUrl: '',
    siteName: 'Now Funded'
  };
  if(!STATE.settings.affiliateToolkit) STATE.settings.affiliateToolkit=[];
  if(!STATE.settings.customAlerts) STATE.settings.customAlerts=[];
  if(!STATE.accountTransfers) STATE.accountTransfers=[];
  if(!STATE.bookStages || !STATE.bookStages.length) STATE.bookStages=[
    { id: 'bbook', name: 'B-Book (Simulation)', description: 'Every account starts here. Trades run in a simulated environment — no real money moves, but your rules, targets, and drawdown all apply exactly as normal.' },
    { id: 'hbook', name: 'H-Book (Hybrid)', description: 'Unlocked once your trading behavior is proven consistent. We begin blending in live-market execution alongside simulation.' },
    { id: 'inhouse', name: 'In-House Trader', description: "You're invited to trade our real capital directly and earn a salary on top of your profit share — not just a funded account anymore, effectively an employed trader." }
  ];
  if(!STATE.settings.affiliateTiers || !STATE.settings.affiliateTiers.length) STATE.settings.affiliateTiers=[
    { id:'tier_starter', name:'Affiliate Starter', minReferrals:0, commissionPct:STATE.settings.affiliateCommissionRate||15 },
    { id:'tier_rising', name:'Rising Star', minReferrals:5, commissionPct:STATE.settings.affiliateCommissionRate||15 },
    { id:'tier_champion', name:'Now Funded Champion', minReferrals:45, commissionPct:18 },
    { id:'tier_elite', name:'Elite Ambassador', minReferrals:60, commissionPct:20 },
    { id:'tier_partner', name:'Now Funded Partner', minReferrals:80, commissionPct:25 }
  ];
  var tabs=['orders','plans','pool','codes','payouts','affiliate','tiers','users','transfers','promotions','alerts','content','avatars','tickets','kyc','analytics','seo','settings','database'];
  if(!STATE.settings.avatarLibrary) STATE.settings.avatarLibrary = [];
  document.getElementById('nav').innerHTML = tabs.map(function(t){return '<span class="'+(t===tab?'active':'')+'" onclick="setTab(\''+t+'\')">'+t+(t==='tickets'?ticketBadge_():'')+'</span>';}).join('') +
    '<span onclick="logoutAdmin()" style="color:var(--danger,#ff6b6b)">log out</span>';
  var emailWarning = (STATE.settings.emailNotificationsEnabled && !STATE.settings.adminEmail) ?
    '<div class="alert"><b>No admin notification email is set.</b> Every admin email — new orders, payout requests, support tickets, KYC submissions — is silently going nowhere. <span style="text-decoration:underline;cursor:pointer" onclick="setTab(\'settings\')">Set one in Settings</span>.</div>' : '';
  document.getElementById('app').innerHTML = emailWarning + ({
    orders: renderOrders, plans: renderPlans, pool: renderPool, codes: renderCodes,
    payouts: renderPayouts, affiliate: renderAffiliate, tiers: renderTiers, users: renderUsers, transfers: renderTransfers, promotions: renderPromotions, alerts: renderAlerts, content: renderContent,
    tickets: renderTicketsTab, kyc: renderKyc, analytics: renderAnalytics, seo: renderSeo, settings: renderSettings,
    avatars: renderAvatars, database: renderDatabase
  })[tab]();
}
function setTab(t){ tab=t; render(); }
function renderGate(){
  document.getElementById('nav').innerHTML='';
  document.getElementById('app').innerHTML = '<div class="card" style="max-width:320px;margin:60px auto"><h2>Admin Access</h2><input id="code" type="password" placeholder="Access code"><button class="btn" style="width:100%" onclick="checkGate()">Enter</button></div>';
}
function checkGate(){
  var entered = document.getElementById('code').value;
  if(entered === STATE.settings.accessCode){
    gateOk=true;
    try{ localStorage.setItem('nf_admin_code', entered); }catch(e){}
    render();
  }
  else alert('Wrong code');
}
function logoutAdmin(){
  gateOk=false;
  try{ localStorage.removeItem('nf_admin_code'); }catch(e){}
  render();
}

// ---------- ORDERS ----------
var orderSearch='', orderStatusFilter='all';
function filteredOrders_(){
  return STATE.orders.filter(function(o){
    var user = STATE.users.find(function(u){return u.id===o.userId;}) || {};
    var matchesSearch = !orderSearch || o.orderCode.toLowerCase().indexOf(orderSearch)!==-1 || (user.email||'').toLowerCase().indexOf(orderSearch)!==-1;
    var matchesStatus = orderStatusFilter==='all' || o.status===orderStatusFilter;
    return matchesSearch && matchesStatus;
  });
}
function exportOrdersCsv(){
  var headers = ['Order Code','User Email','Plan','Account Size','Amount','Status','Payment Method','Flutterwave Ref','Created At','Confirmed At'];
  var rows = filteredOrders_().map(function(o){
    var user = STATE.users.find(function(u){return u.id===o.userId;}) || {};
    var plan = STATE.plans.find(function(p){return p.id===o.planId;}) || {};
    return [o.orderCode, user.email||'', plan.name||'', plan.size||'', o.amount, o.status, o.paymentMethod||'', o.flwRef||'', o.createdAt||'', o.confirmedAt||''];
  });
  exportCsv_('orders-'+Date.now()+'.csv', headers, rows);
}
function renderOrders(){
  // Grouped by account SIZE now (pool is universal across plans of the same size),
  // not by the old per-plan category tag.
  var low = STATE.mt5Pool.reduce(function(m,l){ if(!l.used && l.size){ m[l.size]=(m[l.size]||0)+1; } return m; },{});
  var lowHtml = Object.keys(low).filter(function(s){return low[s] < STATE.settings.lowStockThreshold;})
    .map(function(s){return '<div class="alert">Low stock: '+sizeLabel_(s)+' accounts — only '+low[s]+' unused logins left</div>';}).join('');
  var closed = STATE.traderAccounts.filter(function(a){return a.status==='closed' && !a.poolReturned;});
  var closedHtml = closed.map(function(a){return '<div class="alert">Needs password reset: '+a.login+' ('+a.category+') — <button class="btn small" onclick="returnToPool(\''+a.id+'\')">Mark Reset & Return to Pool</button></div>';}).join('');
  var filtered = filteredOrders_();
  var rows = filtered.slice().reverse().map(function(o){
    var user = STATE.users.find(function(u){return u.id===o.userId;}) || {};
    var plan = STATE.plans.find(function(p){return p.id===o.planId;}) || {};
    var bnplNote = isBNPL_(plan) ? '<div class="muted" style="font-size:11px">BNPL upfront — '+naira(bnplSplit_(plan).balance)+' due on funded phase</div>' : '';
    // Flutterwave orders are auto-confirmed the instant payment is verified, but if
    // no unused MT5 login existed at that moment they stay 'pending' with payment
    // already received — surface that clearly so admin knows not to wait on a
    // transfer that already happened, just to assign a login once stock is added.
    var paidNote = (o.paymentMethod==='flutterwave') ?
      (o.status==='pending' ? '<div class="muted" style="font-size:11px;color:#D3403F">Paid via Flutterwave — no MT5 login was available to auto-assign</div>' : '<div class="muted" style="font-size:11px">Paid via Flutterwave'+(o.flwRef?' · ref '+o.flwRef:'')+'</div>') : '';
    return '<tr><td>'+o.orderCode+'</td><td>'+(user.email||'-')+'</td><td>'+(plan.name||'-')+(isBNPL_(plan)?' <span class="badge b-active" style="font-size:10px">BNPL</span>':'')+'</td><td>'+naira(o.amount)+bnplNote+paidNote+'</td>'+
      '<td><span class="badge b-'+o.status+'">'+o.status+'</span></td>'+
      '<td>'+(o.status==='pending'? '<button class="btn small" onclick="confirmOrder(\''+o.id+'\')">Confirm</button> <button class="btn small danger" onclick="rejectOrder(\''+o.id+'\')">Reject</button>':'-')+'</td></tr>';
  }).join('');
  return '<h2>Orders</h2>'+lowHtml+closedHtml+
    '<div class="card row"><input id="ord_search" placeholder="Search code or email" value="'+orderSearch+'" oninput="orderSearch=this.value.toLowerCase();render()" style="max-width:220px">'+
    '<select id="ord_status" onchange="orderStatusFilter=this.value;render()"><option value="all">All</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="rejected">Rejected</option></select>'+
    '<button class="btn small" onclick="exportOrdersCsv()">Export CSV</button></div>'+
    '<div class="card"><table><tr><th>Code</th><th>User</th><th>Plan</th><th>Amount</th><th>Status</th><th>Action</th></tr>'+rows+'</table></div>';
}
function pctFromRules_(rules, labelSubstr){
  if(!rules) return null;
  var r = rules.find(function(x){return (x.label||'').toLowerCase().indexOf(labelSubstr)!==-1;});
  if(!r) return null;
  var n = parseFloat(String(r.value).replace('%',''));
  return isNaN(n) ? null : n;
}
function confirmOrder(orderId){
  saveAction(function(){
    var order = STATE.orders.find(function(o){return o.id===orderId;});
    if(!order || order.status!=='pending'){ alert('This order is no longer pending — no changes made.'); return false; }
    var plan = STATE.plans.find(function(p){return p.id===order.planId;});
    // Universal pool: any unused login of the matching ACCOUNT SIZE can be handed
    // out, regardless of which plan (drawdown type / step count) it was bought under.
    var login = STATE.mt5Pool.find(function(l){return l.size===plan.size && !l.used;});
    if(!login){ alert('No unused '+sizeLabel_(plan.size)+' MT5 login available. Upload more logins first.'); return false; }
    login.used = true; login.assignedTo = order.userId;
    order.status='confirmed'; order.confirmedAt=new Date().toISOString();
    if(order.discountCode){
      var dc = STATE.discountCodes.find(function(d){return d.code===order.discountCode;});
      if(dc) dc.usedCount = (dc.usedCount||0) + 1;
    }
    var profitTargetPct = pctFromRules_(plan.rules, 'profit target');
    var maxDrawdownPct = pctFromRules_(plan.rules, 'max drawdown') || pctFromRules_(plan.rules, 'max overall drawdown');
    var acc = {id:uid('ta'),userId:order.userId,orderId:order.id,mt5PoolId:login.id,login:login.login,password:login.password,server:login.server,
      category:plan.category,planId:plan.id,stage:'phase1',status:'active',reason:null,startBalance:plan.size||0,currentBalance:plan.size||0,equity:plan.size||0,
      profitTargetPct:profitTargetPct,maxDrawdownPct:maxDrawdownPct,
      balanceHistory:[],poolReturned:false,createdAt:new Date().toISOString()};
    STATE.traderAccounts.push(acc);
    STATE.notifications.push({id:uid('nt'),userId:order.userId,message:'Your order '+order.orderCode+' was confirmed. MT5 login assigned!',read:false,createdAt:new Date().toISOString()});
    sendMail(userEmail_(order.userId), 'Your order '+order.orderCode+' was confirmed', 'Good news — your order '+order.orderCode+' has been confirmed and an MT5 login has been assigned. Log in to your dashboard to view your account details.');
    // Credit affiliate commission now that the purchase is confirmed as real (paid) —
    // this is the only point a referred user's order is verified, so it's the only
    // correct place to pay the referrer for it.
    var buyer = STATE.users.find(function(x){return x.id===order.userId;});
    if(buyer && buyer.referredBy){
      var referrer = STATE.users.find(function(x){return x.id===buyer.referredBy;});
      if(referrer){
        var commissionPct = affCurrentTier_(referrer).current.commissionPct || 0;

// Universal pool: logins are matched to orders by ACCOUNT SIZE only (l.size ===
// plan.size). "category" is kept purely as an optional cosmetic label (shown in
// the table, copied onto trader accounts for display) — it plays no role in
// which login gets handed out.
var poolShowAdvanced = false;
var poolSearch = '', poolPage = 0;
var POOL_PAGE_SIZE = 25;
function filteredPool_(){
  var all = STATE.mt5Pool.slice().reverse();
  if(!poolSearch) return all;
  return all.filter(function(l){
    return (l.login||'').toLowerCase().indexOf(poolSearch)!==-1 ||
      (l.category||'').toLowerCase().indexOf(poolSearch)!==-1 ||
      String(l.size||'').indexOf(poolSearch)!==-1;
  });
}
function exportPoolCsv(){
  var headers = ['Login','Password','Server','Account Size','Category','Status','Assigned To User ID'];
  var rows = STATE.mt5Pool.map(function(l){
    return [l.login, l.password, l.server, l.size||'', l.category||'', l.used?'Used':'Unused', l.assignedTo||''];
  });
  exportCsv_('mt5-pool-'+Date.now()+'.csv', headers, rows);
}
function renderPool(){
  var unsized = STATE.mt5Pool.filter(function(l){return !l.size;}).length;
  var migrateHtml = unsized ? (
    '<div class="card"><h4>Migrate Existing Pool to Universal</h4>'+
    '<div class="alert">'+unsized+' login(s) still have no Account Size set, so they can\'t be auto-assigned yet.</div>'+
    '<div class="muted">Run this once: it tags every existing login (used and unused) with an Account Size — inferred from the trader account it was already assigned to (if used), or from a plan sharing its old category tag (if unused). Already-sized logins are left untouched, so it\'s safe to run more than once.</div>'+
    '<button class="btn warn" style="margin-top:8px" onclick="migratePoolToUniversal()">Run Migration</button></div>'
  ) : '';
  var counts = {};
  STATE.mt5Pool.forEach(function(l){ var key=l.size||'unsized'; counts[key]=counts[key]||{used:0,unused:0}; counts[key][l.used?'used':'unused']++; });
  var sizeKeys = Object.keys(counts).sort(function(a,b){ if(a==='unsized') return 1; if(b==='unsized') return -1; return Number(a)-Number(b); });
  var countHtml = sizeKeys.map(function(k){return '<div class="kv">'+(k==='unsized'?'<span style="color:var(--danger)">No size set</span>':sizeLabel_(k))+': '+counts[k].unused+' unused / '+counts[k].used+' used</div>';}).join('');
  var filtered = filteredPool_();
  var totalPages = Math.max(1, Math.ceil(filtered.length / POOL_PAGE_SIZE));
  if(poolPage >= totalPages) poolPage = totalPages - 1;
  if(poolPage < 0) poolPage = 0;
  var pageItems = filtered.slice(poolPage*POOL_PAGE_SIZE, poolPage*POOL_PAGE_SIZE + POOL_PAGE_SIZE);
  var rows = pageItems.map(function(l){
    return '<tr><td>'+l.login+'</td><td>'+(l.size?sizeLabel_(l.size):'<span style="color:var(--danger)">none</span>')+'</td><td>'+(l.category||'-')+'</td><td>'+(l.used?'Used':'Unused')+'</td>'+
      '<td><button class="btn small" onclick="editPoolSize(\''+l.id+'\')">'+(l.size?'Edit Size':'Set Size')+'</button></td></tr>';
  }).join('');
  var pagerHtml = '<div class="row" style="margin-top:8px"><span class="muted">'+filtered.length+' login(s)'+(poolSearch?' matching “'+poolSearch+'”':'')+' · Page '+(poolPage+1)+' of '+totalPages+'</span>'+
    '<div><button class="btn small" '+(poolPage<=0?'disabled':'')+' onclick="poolPage--;render()">‹ Prev</button> <button class="btn small" '+(poolPage>=totalPages-1?'disabled':'')+' onclick="poolPage++;render()">Next ›</button></div></div>';
  var categoryOpts = Array.from(new Set(STATE.plans.map(function(p){return p.category;}).filter(Boolean)));
  var catDatalist = '<datalist id="pool_cat_list">'+categoryOpts.map(function(c){return '<option value="'+c+'">';}).join('')+'</datalist>';
  return '<h2>MT5 Login Pool</h2>'+migrateHtml+
    '<div class="card">'+(countHtml||'<div class="muted">No logins added yet.</div>')+'</div>'+
    '<div class="card"><h4>Add a Login</h4>'+catDatalist+
    '<div class="field-row"><div><label>Login</label><input id="pf_login" placeholder="e.g. 1005812"></div><div><label>Password</label><input id="pf_password" placeholder="Investor/master password"></div></div>'+
    '<div class="field-row"><div><label>Server</label><input id="pf_server" placeholder="e.g. NF-Live"></div><div><label>Account Size</label><input id="pf_size" type="number" placeholder="e.g. 200000"></div></div>'+
    '<label>Category tag (optional, cosmetic label only — e.g. equity-2step)</label><input id="pf_category" list="pool_cat_list" placeholder="Optional">'+
    '<button class="btn" style="width:100%" onclick="addPoolLogin()">Add to Pool</button>'+
    '<div class="muted" style="margin-top:8px;cursor:pointer" onclick="poolShowAdvanced=!poolShowAdvanced;render()">'+(poolShowAdvanced?'▾ Hide':'▸ Show')+' advanced: bulk-paste JSON</div>'+
    (poolShowAdvanced? '<div style="margin-top:8px"><textarea id="pool_json" rows="6" placeholder=\'[{"login":"1001","password":"abc","server":"NF-Live","size":200000,"category":"equity-2step (optional)"}]\'></textarea>'+
      '<button class="btn warn" onclick="addPool()">Add Bulk JSON</button></div>' : '')+
    '</div>'+
    '<div class="card row"><input id="pool_search" placeholder="Search login, size, or category" value="'+poolSearch+'" oninput="poolSearch=this.value.toLowerCase();poolPage=0;render()" style="max-width:260px">'+
    '<button class="btn small" onclick="exportPoolCsv()">Export CSV</button></div>'+
    '<div class="card"><table><tr><th>Login</th><th>Size</th><th>Category</th><th>Status</th><th></th></tr>'+rows+'</table>'+pagerHtml+'</div>';
}
function addPoolLogin(){
  // Read the form once, up front — these are the values the admin actually typed,
  // and they must stay fixed across any silent retry (the retry closure below
  // re-checks the POOL for duplicates against fresh data, but re-reading the DOM
  // after a retry could pick up already-cleared fields).
  var login = document.getElementById('pf_login').value.trim();
  var password = document.getElementById('pf_password').value.trim();
  var server = document.getElementById('pf_server').value.trim();
  var size = Number(document.getElementById('pf_size').value);
  var category = document.getElementById('pf_category').value.trim();
  if(!login || !password || !server || !size) return alert('Fill in Login, Password, Server and Account Size');
  saveAction(function(){
    if(STATE.mt5Pool.some(function(l){return l.login===login;})){ alert('Login "'+login+'" is already in the pool. Each MT5 login can only be added once.'); return false; }
    STATE.mt5Pool.push({id:uid('m5'),login:login,password:password,server:server,size:size,category:category,used:false,assignedTo:null});
    log('add_pool', '1 login ('+sizeLabel_(size)+')');
  }, function(){
    ['pf_login','pf_password','pf_server','pf_size','pf_category'].forEach(function(id){ var el = document.getElementById(id); if(el) el.value=''; });
  });
}
function editPoolSize(id){
  var l = STATE.mt5Pool.find(function(x){return x.id===id;});
  if(!l) return;
  var sizeStr = prompt('Account size for login '+l.login+' (e.g. 200000)', l.size||'');
  if(sizeStr===null) return;
  var n = Number(sizeStr);
  if(!n) return alert('Enter a valid number');
  saveAction(function(){
    var login = STATE.mt5Pool.find(function(x){return x.id===id;});
    if(!login) return false;
    login.size = n;
    log('set_pool_size', login.login+' -> '+sizeLabel_(n));
  });
}
function migratePoolToUniversal(){
  if(!confirm('This tags every MT5 pool login (used and unused) with an Account Size, so any available login of the right size can be handed out regardless of which plan it was originally stocked for. Already-sized logins are skipped. Continue?')) return;
  var result = {updated:0, unresolved:[]};
  saveAction(function(){
    result.updated = 0; result.unresolved = [];
    STATE.mt5Pool.forEach(function(l){
      if(l.size) return;
      var size = null;
      // Used logins: trust the trader account it was actually assigned to —
      // startBalance was set to the plan's size at the moment of assignment.
      if(l.used){
        var ta = STATE.traderAccounts.find(function(a){ return a.mt5PoolId===l.id; });
        if(ta && ta.startBalance) size = ta.startBalance;
      }
      // Unused (or no matching trader account found): fall back to a plan that
      // still shares this login's old category tag.
      if(!size && l.category){
        var plan = STATE.plans.find(function(p){ return p.category===l.category; });
        if(plan && plan.size) size = plan.size;
      }
      // Last resort: parse a number straight out of the category string itself
      // (e.g. "equity-2step-10k" -> 10000, "200000" -> 200000).
      if(!size && l.category){
        var m = String(l.category).match(/(\d+(?:\.\d+)?)\s*(k)?/i);
        if(m){ size = parseFloat(m[1]); if(m[2]) size *= 1000; }
      }
      if(size){ l.size = size; result.updated++; }
      else { result.unresolved.push(l.login); }
    });
    log('migrate_pool_universal', result.updated+' logins tagged'+(result.unresolved.length? ', '+result.unresolved.length+' unresolved':''));
  }, function(){
    alert('Migration done.\n\n'+result.updated+' logins were tagged with a size automatically.'+
      (result.unresolved.length? '\n\n'+result.unresolved.length+' could not be auto-resolved (no matching trader account, plan, or parseable category): '+result.unresolved.join(', ')+'.\nUse "Set Size" on each in the table below to fix manually.' : ''));
  });
}
function addPool(){
  var arr;
  try{ arr = JSON.parse(document.getElementById('pool_json').value); }
  catch(e){ return alert('Invalid JSON: '+e.message); }
  var result = {added:0, skipped:[]};
  saveAction(function(){
    var existingLogins = {};
    STATE.mt5Pool.forEach(function(l){ existingLogins[l.login] = true; });
    result.added = 0; result.skipped = [];
    arr.forEach(function(l){
      if(existingLogins[l.login]){ result.skipped.push(l.login); return; } // already in pool
      existingLogins[l.login] = true; // guard against duplicates within the same pasted batch too
      STATE.mt5Pool.push({id:uid('m5'),login:l.login,password:l.password,server:l.server,size:Number(l.size)||null,category:l.category||'',used:false,assignedTo:null});
      result.added++;
    });
    log('add_pool', result.added+' logins'+(result.skipped.length? ' ('+result.skipped.length+' duplicates skipped)':''));
  }, function(){
    if(result.skipped.length) alert(result.added+' login(s) added. '+result.skipped.length+' login(s) skipped as duplicates (already in the pool or repeated in the pasted list): '+result.skipped.join(', '));
  });
}

function saveTier(){
  var id = document.getElementById('tier_id').value;
  var name = document.getElementById('tier_name').value.trim();
  var min = Number(document.getElementById('tier_min').value);
  var pct = Number(document.getElementById('tier_pct').value);
  if(!name) return alert('Enter a tier name.');
  if(isNaN(min) || min<0) return alert('Min referrals must be 0 or more.');
  if(isNaN(pct) || pct<0 || pct>100) return alert('Commission % must be between 0 and 100.');
  if(!STATE.settings.affiliateTiers) STATE.settings.affiliateTiers=[];
  if(id){
    var t = STATE.settings.affiliateTiers.find(function(x){return x.id===id;});
    if(!t) return alert('That tier no longer exists.');
    var dupMin = STATE.settings.affiliateTiers.some(function(x){return x.id!==id && x.minReferrals===min;});
    if(dupMin) return alert('Another tier already starts at '+min+' referrals — thresholds must be unique.');
    t.name=name; t.minReferrals=min; t.commissionPct=pct;
  } else {
    var dupMin2 = STATE.settings.affiliateTiers.some(function(x){return x.minReferrals===min;});
    if(dupMin2) return alert('A tier already starts at '+min+' referrals — edit it instead of adding a duplicate.');
    STATE.settings.affiliateTiers.push({id:uid('tier'), name:name, minReferrals:min, commissionPct:pct});
  }
  log('save_tier', name+' ('+min+'+ referrals, '+pct+'%)');
  save(function(){ clearTierForm(); });
}
function deleteTier(id){
  var tiers = STATE.settings.affiliateTiers||[];
  var t = tiers.find(function(x){return x.id===id;});
  if(!t) return;
  if(tiers.length<=1) return alert("Can't delete the last tier — affiliates need at least one commission rate to match.");
  if(t.minReferrals===0 && !tiers.some(function(x){return x.id!==id && x.minReferrals===0;})){
    if(!confirm('This is the only tier starting at 0 referrals — deleting it means brand-new affiliates won\'t match any tier until they hit the next threshold, and commission crediting will fall back to a 15% default. Delete anyway?')) return;
  }
  STATE.settings.affiliateTiers = tiers.filter(function(x){return x.id!==id;});
  log('delete_tier', t.name);
  save();
}

// Flags a possible self-referral: does this user share a NIN or bank account with
// someone they're connected to via the referral program (as referrer or referred),
// or did they receive a funded account via transfer from someone connected that way?
// The transfer path matters because someone can refer their own second account, fund
// it there, then transfer the funded account back to themselves — collecting the
// referral discount, the commission, AND the profit share without ever passing a
// challenge on their real account. Doesn't block anything by itself — admin still
// decides — it's a warning at the moment of payout approval, which is the point real
// money moves, and it now fires for trader (profit-share) payouts too, not just
// affiliate ones, since that's the payout type this abuse path actually cashes out through.
function sameIdentity_(a, b){
  if(!a || !b) return false;
  if(a.kycIdNumber && b.kycIdNumber && a.kycIdNumber===b.kycIdNumber) return true;
  var aBank = (STATE.payoutRequests.find(function(x){return x.userId===a.id && x.bankDetails;})||{}).bankDetails;
  var bBank = (STATE.payoutRequests.find(function(x){return x.userId===b.id && x.bankDetails;})||{}).bankDetails;
  return !!(aBank && bBank && aBank.trim().toLowerCase()===bBank.trim().toLowerCase());
}
function selfReferralFlag_(userId){
  var u = STATE.users.find(function(x){return x.id===userId;});
  if(!u) return null;
  var reasons = [];
  var referred = STATE.users.filter(function(x){return x.referredBy===u.id;});
  referred.forEach(function(r){
    if(sameIdentity_(u,r)) reasons.push(r.email+' (referred user) shares the same NIN or bank details');
  });
  if(u.referredBy){
    var referrer = STATE.users.find(function(x){return x.id===u.referredBy;});
    if(referrer && sameIdentity_(u,referrer)) reasons.push(referrer.email+' (the user who referred them) shares the same NIN or bank details');
  }
  // Self-referral + account-transfer combo: flag if this user now owns a funded account
  // that was transferred to them by someone linked via the referral program in either
  // direction, or who otherwise looks like the same person.
  (STATE.accountTransfers||[]).filter(function(t){return t.toUserId===userId && t.status==='accepted';}).forEach(function(t){
    var sender = STATE.users.find(function(x){return x.id===t.fromUserId;});
    if(!sender) return;
    var linkedByReferral = sender.referredBy===u.id || u.referredBy===sender.id;
    var identityMatch = sameIdentity_(u,sender);
    if(linkedByReferral || identityMatch){
      reasons.push(sender.email+' transferred them a '+t.accountCategory+' account and is linked via the referral program'+(identityMatch?' and shares the same NIN or bank details':''));
    }
  });
  return reasons.length ? reasons.join('; ') : null;
}
function approvePayout(id){
  saveAction(function(){
    var p = STATE.payoutRequests.find(function(x){return x.id===id;});
    if(!p || p.status!=='pending'){ return false; } // already handled — nothing to do
    var flag = selfReferralFlag_(p.userId);
    if(flag && !confirm('Possible self-referral: '+flag+'.\n\nApprove this '+p.type+' payout anyway?')) return false;
    p.status='paid';
    STATE.notifications.push({id:uid('nt'),userId:p.userId,message:'Your payout of '+naira(p.amount)+' was approved.',read:false,createdAt:new Date().toISOString()});
    sendMail(userEmail_(p.userId), 'Your payout of '+naira(p.amount)+' was approved', 'Your payout request of '+naira(p.amount)+' has been approved and is being processed.');
    log('approve_payout', p.id);
  });
}
function denyPayout(id){
  saveAction(function(){
    var p=STATE.payoutRequests.find(function(x){return x.id===id;});
    if(!p || p.status!=='pending'){ return false; } // already handled — nothing to do

  });
}

  var a = STATE.traderAccounts.find(function(x){return x.id===id;});

// Admin override: force-move a trader account to ANY email, unlike the user-to-user
// transfer flow in App.html (which requires the recipient to already be registered
// and to accept the request). Here admin can target an email that has no account
// yet — in that case a new minimal user record is created on the spot (with a
// random temp password) so the account has somewhere to land immediately.
function adminTransferAccount(accountId){
  var acc = STATE.traderAccounts.find(function(a){return a.id===accountId;});
  if(!acc) return alert('Account not found.');
  var owner = STATE.users.find(function(u){return u.id===acc.userId;});
  var email = prompt('Transfer this '+acc.category+' account (login '+acc.login+') to which email?'+(owner?'\nCurrently owned by '+(owner.email||owner.name||owner.id):''));
  if(!email) return;
  email = email.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return alert('Enter a valid email address.');
  if(owner && (owner.email||'').toLowerCase()===email) return alert('That account is already owned by this email.');
  var recipient = STATE.users.find(function(u){return (u.email||'').toLowerCase()===email;});
  var isNewUser = false, tempPassword = null;
  if(!recipient){
    if(!confirm('No registered user has this email yet.\n\nCreate a new account for '+email+' and transfer this account to it?')) return;
    isNewUser = true;
    tempPassword = Math.random().toString(36).slice(2,10);
    recipient = {id:uid('u'),name:email.split('@')[0],email:email,phone:'',password:tempPassword,avatarUrl:'',referralCode:uid('ref').slice(0,10),referredBy:null,affiliateEarnings:0,kycStatus:'none',kycCountry:'',kycIdNumber:'',bookStage:'bbook',createdAt:new Date().toISOString()};
  } else if(!confirm('Transfer the '+acc.category+' account (login '+acc.login+') to '+email+'?')){
    return;
  }
  saveAction(function(){
    var a = STATE.traderAccounts.find(function(x){return x.id===accountId;});
    if(!a) { alert('Account no longer exists.'); return false; }
    var fromUserId = a.userId;
    if(isNewUser) STATE.users.push(recipient);
    a.userId = recipient.id;
    if(!STATE.accountTransfers) STATE.accountTransfers = [];
    STATE.accountTransfers.push({id:uid('tr'),accountId:a.id,accountCategory:a.category,fromUserId:fromUserId,toUserId:recipient.id,status:'accepted',createdAt:new Date().toISOString(),respondedAt:new Date().toISOString(),initiatedBy:'admin'});
    if(fromUserId){
      STATE.notifications.push({id:uid('nt'),userId:fromUserId,message:'Your '+a.category+' account (login '+a.login+') was transferred to '+email+' by an admin.',read:false,createdAt:new Date().toISOString()});
      sendMail(userEmail_(fromUserId), 'Account transferred', 'Your '+a.category+' account (login '+a.login+') has been transferred to '+email+' by an admin.');
    }
    STATE.notifications.push({id:uid('nt'),userId:recipient.id,message:'A '+a.category+' account (login '+a.login+') was transferred to you by an admin.',read:false,createdAt:new Date().toISOString()});
    sendMail(recipient.email, 'An account was transferred to you', 'A '+a.category+' account (login '+a.login+') has been transferred to you by an admin.'+(isNewUser?' A new Now Funded account was created for you — email: '+email+', temporary password: '+tempPassword+'. Please log in and change your password as soon as possible.':''));
    log('admin_transfer_account', a.login+' -> '+email+(isNewUser?' (new user created)':''));
  }, function(){ alert('Account transferred to '+email+(isNewUser?' (new user account created).':'.')); });
}

function sendTicketReply(id){

// ---------- KYC ----------
function renderKyc(){
  var pending = STATE.users.filter(function(u){return u.kycStatus==='pending';});
  var byNin = {};
  STATE.users.forEach(function(u){ if(u.kycIdNumber){ (byNin[u.kycIdNumber]=byNin[u.kycIdNumber]||[]).push(u); } });
  var rows = pending.map(function(u){
    var dupes = (byNin[u.kycIdNumber]||[]).filter(function(x){return x.id!==u.id;});
    var flag = dupes.length ? ' <span class="badge b-rejected" title="Same NIN as: '+dupes.map(function(x){return x.email;}).join(', ')+'">⚠ Duplicate NIN</span>' : '';
    return '<tr><td>'+u.email+flag+'</td><td>'+u.kycCountry+'</td><td>'+u.kycIdNumber+'</td>'+
      '<td><button class="btn small" onclick="setKyc(\''+u.id+'\',\'approved\')">Approve</button> <button class="btn small danger" onclick="setKyc(\''+u.id+'\',\'none\')">Reject</button></td></tr>';
  }).join('');
  var all = STATE.users.map(function(u){return '<div class="kv">'+u.email+' — <span class="badge b-'+(u.kycStatus==='approved'?'active':u.kycStatus==='pending'?'pending':'closed')+'">'+u.kycStatus+'</span></div>';}).join('');
  return '<h2>KYC — Pending Review</h2>'+
    '<div class="muted" style="margin-bottom:10px">Users submit their NIN in-app, then upload a selfie + NIN photo via the verification form linked in Settings. Review the form submission, then Approve/Reject here.</div>'+
    '<div class="card"><table><tr><th>Email</th><th>Country</th><th>ID Number</th><th></th></tr>'+(rows||'<tr><td colspan="4" class="muted">None pending</td></tr>')+'</table></div>'+
    '<h4>All Users</h4><div class="card">'+all+'</div>';
}
function setKyc(userId,status){
  var u=STATE.users.find(function(x){return x.id===userId;});
  u.kycStatus=status;
  if(status==='approved') sendMail(u.email, 'Your identity has been verified', 'Your identity verification was approved. You can now purchase challenges and request payouts.');
  else if(status==='rejected') sendMail(u.email, 'Your identity verification needs attention', 'Your identity verification was not approved. Please open a support ticket or resubmit your details.');
  save();
}

function editAlert(id){ alertEditId = id; render(); }
function cancelAlertEdit(){ alertEditId = null; render(); }
function saveAlert(){
  var imageUrl = document.getElementById('al_image').value.trim();
  if(!imageUrl) return alert('Paste an image URL first');
  var data = {
    title: document.getElementById('al_title').value.trim(),
    imageUrl: imageUrl,
    linkUrl: document.getElementById('al_link').value.trim(),
    targetScreen: document.getElementById('al_screen').value,
    maxShows: parseInt(document.getElementById('al_max').value, 10) || 0,
    cooldownHours: parseInt(document.getElementById('al_cooldown').value, 10) || 0,
    active: document.getElementById('al_active').checked
  };
  if(!STATE.settings.customAlerts) STATE.settings.customAlerts = [];
  if(alertEditId){
    var existing = STATE.settings.customAlerts.find(function(a){return a.id===alertEditId;});
    if(existing) Object.assign(existing, data);
    log('edit_alert', data.title||imageUrl);
  } else {
    STATE.settings.customAlerts.push(Object.assign({id:uid('al'), createdAt:new Date().toISOString()}, data));
    log('add_alert', data.title||imageUrl);
  }
  alertEditId = null;
  save(function(){ render(); });
}
function toggleAlertActive(id){
  var a = (STATE.settings.customAlerts||[]).find(function(x){return x.id===id;});
  if(!a) return;
  a.active = !a.active;
  save(function(){ render(); });
}
function deleteAlert(id){
  if(!confirm('Delete this alert? This cannot be undone.')) return;
  STATE.settings.customAlerts = (STATE.settings.customAlerts||[]).filter(function(a){return a.id!==id;});
  save(function(){ render(); });
}

    '<button class="btn danger" onclick="clearDatabase()">Clear Entire Database</button></div>'+
    '<div class="card"><b>Raw JSON Editor</b><div class="muted" style="margin:6px 0">Edit the entire database directly. Only for advanced fixes — a bad edit can corrupt the site\'s data.</div>'+
    '<textarea class="rawjson" id="raw_json">'+escapeHtml_(JSON.stringify(STATE, null, 2))+'</textarea>'+
    '<button class="btn" onclick="saveRawJson()">Save Raw JSON</button> <button class="btn warn" onclick="render()">Discard Changes</button></div>';
}
function escapeHtml_(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function saveRawJson(){
  var text = document.getElementById('raw_json').value;
  try{
    var parsed = JSON.parse(text);
    if(!confirm('Overwrite the entire database with this JSON? This replaces everything.')) return;
    STATE = parsed;
    save();
  }catch(e){ alert('Invalid JSON: '+e.message); }
}
function clearDatabase(){
  if(!confirm('This will permanently delete ALL users, orders, accounts, and settings. Continue?')) return;
  if(!confirm('Are you absolutely sure? This cannot be undone.')) return;
  fetch(WEBAPP_URL + '?action=default')
    .then(function(r){ return r.json(); })
    .then(function(data){
      STATE = (typeof data === 'string') ? JSON.parse(data) : data;
      save(function(){ alert('Database cleared.'); });
    })
    .catch(function(err){ alert('Could not fetch default state: '+err); });
}

function saveFlutterwaveSettings(){
  if(!STATE.settings.flutterwave) STATE.settings.flutterwave = {};
  STATE.settings.flutterwave.enabled = document.getElementById('fw_enabled').checked;
  STATE.settings.flutterwave.publicKey = document.getElementById('fw_pubkey').value.trim();
  STATE.settings.flutterwave.verifyUrl = document.getElementById('fw_verifyurl').value.trim();
  log('update_flutterwave_settings', STATE.settings.flutterwave.enabled ? 'enabled' : 'disabled');
  save();
}

boot();
</script>
