<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<title>Now Funded — Admin</title>
<style>
  :root{--bg:#0A0F1F;--bg2:#0d1428;--panel:rgba(255,255,255,0.045);--panel2:rgba(255,255,255,0.06);--line:rgba(255,255,255,0.09);--text:#eef2fa;--muted:#8b96b3;--accent:#3B82F6;--accent2:#10B981;--gold:#FBBF24;--danger:#ef4444;--warn:#f59e0b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg));color:var(--text)}
  .nav{display:flex;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,15,31,0.7);backdrop-filter:blur(10px);z-index:10}
  .nav span{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 10px;border-radius:8px;transition:.15s}
  .nav span.active,.nav span:hover{color:var(--text);background:var(--panel2)}
  .wrap{max-width:1000px;margin:0 auto;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;backdrop-filter:blur(8px)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  input,select,textarea{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin-bottom:8px;font-size:13px}
  label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04150a;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
  .btn.danger{background:var(--danger);color:#fff}
  .btn.warn{background:var(--warn);color:#1a1200}
  .btn.small{padding:5px 10px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  .badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
  .b-pending{background:#78350f;color:#fcd34d}
  .b-confirmed{background:#14532d;color:#86efac}
  .b-rejected,.b-closed{background:#450a0a;color:#fca5a5}
  .alert{background:#450a0a;color:#fecaca;padding:10px;border-radius:10px;margin-bottom:10px;font-size:13px}
  .muted{color:var(--muted);font-size:12px}
  h2{margin-top:0}
</style>
</head>
<body>
<div class="nav" id="nav"></div>
<div class="wrap" id="app">Loading...</div>
<script>
// PASTE YOUR DEPLOYED APPS SCRIPT WEB APP URL HERE (ends in /exec) — same URL as App.html uses
var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwrtEit40wugkoqeu4RBm0xJmE7ow1oRidK-jHfdvdTAcKF1O9svkbCXFb87Wa1C8tTqQ/exec';

var STATE=null, tab='orders', gateOk=false;
function boot(){
  fetch(WEBAPP_URL + '?action=read')
    .then(function(r){ return r.json(); })
    .then(function(data){ STATE = (typeof data === 'string') ? JSON.parse(data) : data; render(); })
    .catch(function(err){ document.getElementById('app').innerHTML = '<div class="card">Could not reach backend. Check WEBAPP_URL. '+err+'</div>'; });
}
// Content-Type: text/plain avoids a CORS preflight (Apps Script can't answer OPTIONS requests).
function save(cb){
  fetch(WEBAPP_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(STATE) })
    .then(function(){ if(cb) cb(); render(); })
    .catch(function(err){ alert('Save failed: '+err); });
}
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function naira(n){ return '₦'+Number(n||0).toLocaleString(); }
function log(action,details){ STATE.activityLog.push({id:uid('lg'),actor:'admin',action:action,details:details,createdAt:new Date().toISOString()}); }

function render(){
  if(!gateOk) return renderGate();
  if(!STATE.chatMessages) STATE.chatMessages = [];
  STATE.users.forEach(function(u){ if(u.kycStatus===undefined) u.kycStatus='none'; if(u.kycCountry===undefined) u.kycCountry=''; if(u.kycIdNumber===undefined) u.kycIdNumber=''; });
  var tabs=['orders','plans','pool','codes','payouts','affiliate','content','chat','kyc','analytics','settings'];
  document.getElementById('nav').innerHTML = tabs.map(function(t){return '<span class="'+(t===tab?'active':'')+'" onclick="setTab(\''+t+'\')">'+t+(t==='chat'?chatBadge_():'')+'</span>';}).join('');
  document.getElementById('app').innerHTML = ({
    orders: renderOrders, plans: renderPlans, pool: renderPool, codes: renderCodes,
    payouts: renderPayouts, affiliate: renderAffiliate, content: renderContent,
    chat: renderChatTab, kyc: renderKyc, analytics: renderAnalytics, settings: renderSettings
  })[tab]();
}
function setTab(t){ tab=t; render(); }
function renderGate(){
  document.getElementById('nav').innerHTML='';
  document.getElementById('app').innerHTML = '<div class="card" style="max-width:320px;margin:60px auto"><h2>Admin Access</h2><input id="code" type="password" placeholder="Access code"><button class="btn" style="width:100%" onclick="checkGate()">Enter</button></div>';
}
function checkGate(){
  if(document.getElementById('code').value === STATE.settings.accessCode){ gateOk=true; render(); }
  else alert('Wrong code');
}

// ---------- ORDERS ----------
var orderSearch='', orderStatusFilter='all';
function renderOrders(){
  var low = STATE.mt5Pool.reduce(function(m,l){ if(!l.used){ m[l.category]=(m[l.category]||0)+1; } return m; },{});
  var lowHtml = Object.keys(low).filter(function(c){return low[c] < STATE.settings.lowStockThreshold;})
    .map(function(c){return '<div class="alert">Low stock: '+c+' — only '+low[c]+' unused logins left</div>';}).join('');
  var closed = STATE.traderAccounts.filter(function(a){return a.status==='closed' && !a.poolReturned;});
  var closedHtml = closed.map(function(a){return '<div class="alert">Needs password reset: '+a.login+' ('+a.category+') — <button class="btn small" onclick="returnToPool(\''+a.id+'\')">Mark Reset & Return to Pool</button></div>';}).join('');
  var filtered = STATE.orders.filter(function(o){
    var user = STATE.users.find(function(u){return u.id===o.userId;}) || {};
    var matchesSearch = !orderSearch || o.orderCode.toLowerCase().indexOf(orderSearch)!==-1 || (user.email||'').toLowerCase().indexOf(orderSearch)!==-1;
    var matchesStatus = orderStatusFilter==='all' || o.status===orderStatusFilter;
    return matchesSearch && matchesStatus;
  });
  var rows = filtered.slice().reverse().map(function(o){
    var user = STATE.users.find(function(u){return u.id===o.userId;}) || {};
    var plan = STATE.plans.find(function(p){return p.id===o.planId;}) || {};
    return '<tr><td>'+o.orderCode+'</td><td>'+(user.email||'-')+'</td><td>'+(plan.name||'-')+'</td><td>'+naira(o.amount)+'</td>'+
      '<td><span class="badge b-'+o.status+'">'+o.status+'</span></td>'+
      '<td>'+(o.status==='pending'? '<button class="btn small" onclick="confirmOrder(\''+o.id+'\')">Confirm</button> <button class="btn small danger" onclick="rejectOrder(\''+o.id+'\')">Reject</button>':'-')+'</td></tr>';
  }).join('');
  return '<h2>Orders</h2>'+lowHtml+closedHtml+
    '<div class="card row"><input id="ord_search" placeholder="Search code or email" value="'+orderSearch+'" oninput="orderSearch=this.value.toLowerCase();render()" style="max-width:220px">'+
    '<select id="ord_status" onchange="orderStatusFilter=this.value;render()"><option value="all">All</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="rejected">Rejected</option></select></div>'+
    '<div class="card"><table><tr><th>Code</th><th>User</th><th>Plan</th><th>Amount</th><th>Status</th><th>Action</th></tr>'+rows+'</table></div>';
}
function pctFromRules_(rules, labelSubstr){
  if(!rules) return null;
  var r = rules.find(function(x){return (x.label||'').toLowerCase().indexOf(labelSubstr)!==-1;});
  if(!r) return null;
  var n = parseFloat(String(r.value).replace('%',''));
  return isNaN(n) ? null : n;
}
function confirmOrder(orderId){
  var order = STATE.orders.find(function(o){return o.id===orderId;});
  var plan = STATE.plans.find(function(p){return p.id===order.planId;});
  var login = STATE.mt5Pool.find(function(l){return l.category===plan.category && !l.used;});
  if(!login) return alert('No unused MT5 login in this category. Upload more logins first.');
  login.used = true; login.assignedTo = order.userId;
  order.status='confirmed'; order.confirmedAt=new Date().toISOString();
  var profitTargetPct = pctFromRules_(plan.rules, 'profit target');
  var maxDrawdownPct = pctFromRules_(plan.rules, 'max drawdown') || pctFromRules_(plan.rules, 'max overall drawdown');
  var acc = {id:uid('ta'),userId:order.userId,orderId:order.id,mt5PoolId:login.id,login:login.login,password:login.password,server:login.server,
    category:plan.category,planId:plan.id,stage:'phase1',status:'active',reason:null,startBalance:plan.size||0,currentBalance:plan.size||0,equity:plan.size||0,
    profitTargetPct:profitTargetPct,maxDrawdownPct:maxDrawdownPct,
    balanceHistory:[],poolReturned:false,createdAt:new Date().toISOString()};
  STATE.traderAccounts.push(acc);
  STATE.notifications.push({id:uid('nt'),userId:order.userId,message:'Your order '+order.orderCode+' was confirmed. MT5 login assigned!',read:false,createdAt:new Date().toISOString()});
  log('confirm_order', order.orderCode);
  save();
}
function rejectOrder(orderId){
  var order = STATE.orders.find(function(o){return o.id===orderId;});
  order.status='rejected';
  STATE.notifications.push({id:uid('nt'),userId:order.userId,message:'Your order '+order.orderCode+' was rejected — no matching payment found.',read:false,createdAt:new Date().toISOString()});
  log('reject_order', order.orderCode);
  save();
}
function markClosed(accId, reason){
  var a = STATE.traderAccounts.find(function(x){return x.id===accId;});
  a.status='closed'; a.reason=reason; a.poolReturned=false;
  log('mark_closed', a.login+' ('+reason+')');
  save();
}
function returnToPool(accId){
  var a = STATE.traderAccounts.find(function(x){return x.id===accId;});
  var login = STATE.mt5Pool.find(function(l){return l.id===a.mt5PoolId;});
  if(login){ login.used=false; login.assignedTo=null; }
  a.poolReturned = true;
  log('return_to_pool', a.login);
  save();
}

// ---------- PLANS (+ drawdown types / plan types) ----------
function renderPlans(){
  var ddOpts = STATE.drawdownTypes.map(function(d){return '<option value="'+d.id+'">'+d.name+'</option>';}).join('');
  var ptOpts = STATE.planTypes.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>';}).join('');
  var rows = STATE.plans.map(function(p){
    var dd=STATE.drawdownTypes.find(function(d){return d.id===p.drawdownTypeId;})||{};
    var pt=STATE.planTypes.find(function(t){return t.id===p.planTypeId;})||{};
    return '<tr><td>'+p.name+'</td><td>'+(dd.name||'-')+'</td><td>'+(pt.name||'-')+'</td><td>'+p.category+'</td><td>'+naira(p.price)+'</td><td><button class="btn small danger" onclick="delPlan(\''+p.id+'\')">Del</button></td></tr>';
  }).join('');
  return '<h2>Drawdown Types</h2><div class="card grid">'+STATE.drawdownTypes.map(function(d){return '<div><b>'+d.name+'</b><div class="muted">'+d.description+'</div></div>';}).join('')+
    '</div><div class="card"><input id="dd_name" placeholder="New drawdown type name"><input id="dd_desc" placeholder="Description"><button class="btn" onclick="addDD()">Add Drawdown Type</button></div>'+
    '<h2>Plan Types</h2><div class="card">'+STATE.planTypes.map(function(p){return '<span class="badge b-confirmed" style="margin-right:6px">'+p.name+'</span>';}).join('')+
    '<div style="margin-top:8px"><input id="pt_name" placeholder="New plan type name"><button class="btn" onclick="addPT()">Add Plan Type</button></div></div>'+
    '<h2>Plans</h2><div class="card"><table><tr><th>Name</th><th>Drawdown</th><th>Type</th><th>Category</th><th>Price</th><th></th></tr>'+rows+'</table></div>'+
    '<div class="card"><h4>Add Plan</h4><label>Name</label><input id="p_name"><label>Drawdown Type</label><select id="p_dd">'+ddOpts+'</select>'+
    '<label>Plan Type</label><select id="p_pt">'+ptOpts+'</select><label>Category tag (must match MT5 pool category)</label><input id="p_cat" placeholder="e.g. equity-2step-10k">'+
    '<label>Account Size</label><input id="p_size" type="number"><label>Price (₦)</label><input id="p_price" type="number">'+
    '<label>Rules (label:value, one per line, e.g. Profit Target:8%)</label><textarea id="p_rules" rows="4"></textarea>'+
    '<label><input type="checkbox" id="p_popular" style="width:auto;margin-right:6px">Mark as Popular</label>'+
    '<button class="btn" onclick="addPlan()">Add Plan</button></div>';
}
function addDD(){ STATE.drawdownTypes.push({id:uid('dd'),name:document.getElementById('dd_name').value,description:document.getElementById('dd_desc').value}); save(); }
function addPT(){ STATE.planTypes.push({id:uid('pt'),name:document.getElementById('pt_name').value}); save(); }
function addPlan(){
  var rulesText = document.getElementById('p_rules').value.trim();
  var rules = rulesText ? rulesText.split('\n').map(function(l){var parts=l.split(':'); return {label:(parts[0]||'').trim(),value:(parts[1]||'').trim()};}) : [];
  STATE.plans.push({id:uid('pl'),name:document.getElementById('p_name').value,drawdownTypeId:document.getElementById('p_dd').value,
    planTypeId:document.getElementById('p_pt').value,category:document.getElementById('p_cat').value,size:Number(document.getElementById('p_size').value),
    price:Number(document.getElementById('p_price').value),rules:rules,popular:document.getElementById('p_popular').checked});
  save();
}
function delPlan(id){ STATE.plans = STATE.plans.filter(function(p){return p.id!==id;}); save(); }

// ---------- MT5 POOL ----------
function renderPool(){
  var counts = {};
  STATE.mt5Pool.forEach(function(l){ counts[l.category]=counts[l.category]||{used:0,unused:0}; counts[l.category][l.used?'used':'unused']++; });
  var countHtml = Object.keys(counts).map(function(c){return '<div class="kv">'+c+': '+counts[c].unused+' unused / '+counts[c].used+' used</div>';}).join('');
  var rows = STATE.mt5Pool.slice(-100).reverse().map(function(l){return '<tr><td>'+l.login+'</td><td>'+l.category+'</td><td>'+(l.used?'Used':'Unused')+'</td></tr>';}).join('');
  return '<h2>MT5 Login Pool</h2><div class="card">'+countHtml+'</div>'+
    '<div class="card"><h4>Paste/Upload JSON</h4><textarea id="pool_json" rows="6" placeholder=\'[{"login":"1001","password":"abc","server":"NF-Live","category":"equity-2step-10k"}]\'></textarea>'+
    '<button class="btn" onclick="addPool()">Add to Pool</button></div>'+
    '<div class="card"><table><tr><th>Login</th><th>Category</th><th>Status</th></tr>'+rows+'</table></div>';
}
function addPool(){
  try{
    var arr = JSON.parse(document.getElementById('pool_json').value);
    arr.forEach(function(l){ STATE.mt5Pool.push({id:uid('m5'),login:l.login,password:l.password,server:l.server,category:l.category,used:false,assignedTo:null}); });
    log('add_pool', arr.length+' logins');
    save();
  }catch(e){ alert('Invalid JSON: '+e.message); }
}

// ---------- DISCOUNT CODES ----------
function renderCodes(){
  var planOpts = STATE.plans.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>';}).join('');
  var rows = STATE.discountCodes.map(function(d){return '<tr><td>'+d.code+'</td><td>'+d.type+' '+d.value+'</td><td>'+d.usedCount+'/'+d.usageLimit+'</td><td>'+(d.active?'Active':'Off')+'</td><td><button class="btn small" onclick="toggleCode(\''+d.code+'\')">Toggle</button></td></tr>';}).join('');
  return '<h2>Discount Codes</h2><div class="card"><table><tr><th>Code</th><th>Value</th><th>Used</th><th>Status</th><th></th></tr>'+rows+'</table></div>'+
    '<div class="card"><h4>New Code</h4><label>Code</label><input id="dc_code"><label>Type</label><select id="dc_type"><option value="percent">Percent</option><option value="flat">Flat ₦</option></select>'+
    '<label>Value</label><input id="dc_value" type="number"><label>Scope (multi-select plans, none = all)</label><select id="dc_scope" multiple size="4">'+planOpts+'</select>'+
    '<label>Usage Limit (total)</label><input id="dc_limit" type="number" value="100"><label>Per-User Limit</label><input id="dc_peruser" type="number" value="1">'+
    '<label>Expiry Date</label><input id="dc_expiry" type="date"><button class="btn" onclick="addCode()">Add Code</button></div>';
}
function addCode(){
  var sel = Array.from(document.getElementById('dc_scope').selectedOptions).map(function(o){return o.value;});
  STATE.discountCodes.push({code:document.getElementById('dc_code').value.trim(),type:document.getElementById('dc_type').value,
    value:Number(document.getElementById('dc_value').value),scope:sel.length?sel:'all',usageLimit:Number(document.getElementById('dc_limit').value),
    usedCount:0,perUserLimit:Number(document.getElementById('dc_peruser').value),expiryDate:document.getElementById('dc_expiry').value,active:true});
  save();
}
function toggleCode(code){ var d=STATE.discountCodes.find(function(x){return x.code===code;}); d.active=!d.active; save(); }

// ---------- PAYOUTS ----------
function renderPayouts(){
  var rows = STATE.payoutRequests.slice().reverse().map(function(p){
    var u = STATE.users.find(function(x){return x.id===p.userId;})||{};
    return '<tr><td>'+(u.email||'-')+'</td><td>'+p.type+'</td><td>'+naira(p.amount)+'</td><td>'+p.bankDetails+'</td><td><span class="badge b-'+p.status+'">'+p.status+'</span></td>'+
      '<td>'+(p.status==='pending'?'<button class="btn small" onclick="approvePayout(\''+p.id+'\')">Approve</button> <button class="btn small danger" onclick="denyPayout(\''+p.id+'\')">Deny</button>':'-')+'</td></tr>';
  }).join('');
  return '<h2>Payout Requests</h2><div class="card"><table><tr><th>User</th><th>Type</th><th>Amount</th><th>Bank</th><th>Status</th><th></th></tr>'+rows+'</table></div>';
}
function approvePayout(id){
  var p = STATE.payoutRequests.find(function(x){return x.id===id;});
  p.status='paid';
  if(p.type==='trader'){
    var u = STATE.users.find(function(x){return x.id===p.userId;});
    var acc = STATE.traderAccounts.find(function(a){return a.userId===p.userId && a.stage==='funded';});
    if(acc && acc.userId){
      var referrer = STATE.users.find(function(x){return x.id===STATE.users.find(function(y){return y.id===p.userId;}).referredBy;});
      if(referrer){ referrer.affiliateEarnings += Math.round(p.amount*STATE.settings.affiliateCommissionRate/100); }
    }
  }
  STATE.notifications.push({id:uid('nt'),userId:p.userId,message:'Your payout of '+naira(p.amount)+' was approved.',read:false,createdAt:new Date().toISOString()});
  log('approve_payout', p.id);
  save();
}
function denyPayout(id){
  var p=STATE.payoutRequests.find(function(x){return x.id===id;});
  p.status='rejected';
  if(p.type==='affiliate'){
    var u = STATE.users.find(function(x){return x.id===p.userId;});
    if(u) u.affiliateEarnings += p.amount; // release the reservation made at request time
  }
  log('deny_payout', p.id);
  save();
}

// ---------- AFFILIATE / ACCOUNT LIFECYCLE ----------
function renderAffiliate(){
  var rows = STATE.traderAccounts.filter(function(a){return a.status!=='closed';}).map(function(a){
    var u = STATE.users.find(function(x){return x.id===a.userId;})||{};
    return '<tr><td>'+(u.email||'-')+'</td><td>'+a.login+'</td><td>'+a.category+'</td><td>'+a.stage+'</td>'+
      '<td><button class="btn small warn" onclick="markClosed(\''+a.id+'\',\'failed\')">Failed</button> <button class="btn small danger" onclick="markClosed(\''+a.id+'\',\'breached\')">Breached</button> '+
      '<button class="btn small" onclick="advanceStage(\''+a.id+'\')">Advance Stage</button></td></tr>';
  }).join('');
  return '<h2>Trader Accounts</h2><div class="card"><table><tr><th>User</th><th>Login</th><th>Category</th><th>Stage</th><th>Actions</th></tr>'+rows+'</table></div>';
}
function advanceStage(id){
  var a = STATE.traderAccounts.find(function(x){return x.id===id;});
  var next = {phase1:'phase2', phase2:'funded', funded:'funded'}[a.stage];
  a.stage = next;
  if(next==='phase2') STATE.certificates.push({id:uid('ct'),userId:a.userId,traderAccountId:a.id,type:'phase1',issuedAt:new Date().toISOString()});
  if(next==='funded') STATE.certificates.push({id:uid('ct'),userId:a.userId,traderAccountId:a.id,type:'funded',issuedAt:new Date().toISOString()});
  STATE.notifications.push({id:uid('nt'),userId:a.userId,message:'Your account advanced to '+next+'!',read:false,createdAt:new Date().toISOString()});
  save();
}
function updateBalance(id){
  var a = STATE.traderAccounts.find(function(x){return x.id===id;});
  var bal = Number(prompt('New balance for '+a.login, a.currentBalance));
  var eq = Number(prompt('New equity for '+a.login, a.equity));
  if(isNaN(bal)||isNaN(eq)) return;
  a.currentBalance=bal; a.equity=eq;
  a.balanceHistory.push({date:new Date().toISOString(),balance:bal,equity:eq});
  save();
}

// ---------- CONTENT (testimonials, faqs) ----------
function renderContent(){
  var tRows = STATE.testimonials.map(function(t,i){return '<div class="kv">"'+t.text+'" — '+t.name+' ('+t.rating+'★) <button class="btn small danger" onclick="delTest('+i+')">Del</button></div>';}).join('');
  var fRows = STATE.faqs.map(function(f,i){return '<div class="kv"><b>'+f.question+'</b>: '+f.answer+' <button class="btn small danger" onclick="delFaq('+i+')">Del</button></div>';}).join('');
  return '<h2>Testimonials</h2><div class="card">'+tRows+'<label>Name</label><input id="t_name"><label>Text</label><input id="t_text"><label>Rating (1-5)</label><input id="t_rating" type="number" min="1" max="5">'+
    '<button class="btn" onclick="addTest()">Add Testimonial</button></div>'+
    '<h2>FAQ</h2><div class="card">'+fRows+'<label>Question</label><input id="f_q"><label>Answer</label><input id="f_a"><button class="btn" onclick="addFaq()">Add FAQ</button></div>';
}
function addTest(){ STATE.testimonials.push({name:document.getElementById('t_name').value,text:document.getElementById('t_text').value,rating:Number(document.getElementById('t_rating').value)}); save(); }
function delTest(i){ STATE.testimonials.splice(i,1); save(); }
function addFaq(){ STATE.faqs.push({question:document.getElementById('f_q').value,answer:document.getElementById('f_a').value}); save(); }
function delFaq(i){ STATE.faqs.splice(i,1); save(); }

// ---------- CHAT ----------
function chatBadge_(){
  var n = STATE.chatMessages.filter(function(m){return m.sender==='user' && !m.read;}).length;
  return n ? ' ('+n+')' : '';
}
var activeChatUser = null;
function renderChatTab(){
  var userIds = Array.from(new Set(STATE.chatMessages.map(function(m){return m.userId;})));
  var list = userIds.map(function(uid_){
    var u = STATE.users.find(function(x){return x.id===uid_;})||{};
    var unread = STATE.chatMessages.filter(function(m){return m.userId===uid_ && m.sender==='user' && !m.read;}).length;
    return '<div class="kv" style="cursor:pointer" onclick="openChatUser(\''+uid_+'\')"><b>'+(u.email||uid_)+'</b>'+(unread?' <span class="badge b-pending">'+unread+'</span>':'')+'</div>';
  }).join('') || '<div class="muted">No conversations yet.</div>';
  var thread = '';
  if(activeChatUser){
    var msgs = STATE.chatMessages.filter(function(m){return m.userId===activeChatUser;});
    thread = '<div class="card"><div style="max-height:260px;overflow:auto">'+msgs.map(function(m){return '<div class="kv" style="text-align:'+(m.sender==='admin'?'right':'left')+'"><b>'+m.sender+':</b> '+m.text+'</div>';}).join('')+'</div>'+
      '<input id="chat_reply" placeholder="Reply..."><button class="btn small" onclick="sendAdminReply()">Send</button></div>';
  }
  return '<h2>Support Chat</h2><div class="card">'+list+'</div>'+thread;
}
function openChatUser(uid_){
  activeChatUser = uid_;
  STATE.chatMessages.forEach(function(m){ if(m.userId===uid_ && m.sender==='user') m.read=true; });
  save();
}
function sendAdminReply(){
  var text = document.getElementById('chat_reply').value.trim();
  if(!text) return;
  STATE.chatMessages.push({id:uid('cm'),userId:activeChatUser,sender:'admin',text:text,read:false,createdAt:new Date().toISOString()});
  save();
}

// ---------- KYC ----------
function renderKyc(){
  var pending = STATE.users.filter(function(u){return u.kycStatus==='pending';});
  var rows = pending.map(function(u){
    return '<tr><td>'+u.email+'</td><td>'+u.kycCountry+'</td><td>'+u.kycIdNumber+'</td>'+
      '<td><button class="btn small" onclick="setKyc(\''+u.id+'\',\'approved\')">Approve</button> <button class="btn small danger" onclick="setKyc(\''+u.id+'\',\'none\')">Reject</button></td></tr>';
  }).join('');
  var all = STATE.users.map(function(u){return '<div class="kv">'+u.email+' — <span class="badge b-'+(u.kycStatus==='approved'?'active':u.kycStatus==='pending'?'pending':'closed')+'">'+u.kycStatus+'</span></div>';}).join('');
  return '<h2>KYC — Pending Review</h2><div class="card"><table><tr><th>Email</th><th>Country</th><th>ID Number</th><th></th></tr>'+(rows||'<tr><td colspan="4" class="muted">None pending</td></tr>')+'</table></div>'+
    '<h4>All Users</h4><div class="card">'+all+'</div>';
}
function setKyc(userId,status){ var u=STATE.users.find(function(x){return x.id===userId;}); u.kycStatus=status; save(); }

// ---------- ANALYTICS ----------
function renderAnalytics(){
  var revenue = STATE.orders.filter(function(o){return o.status==='confirmed';}).reduce(function(s,o){return s+o.amount;},0);
  var activeTraders = STATE.traderAccounts.filter(function(a){return a.status!=='closed';}).length;
  var fundedTraders = STATE.traderAccounts.filter(function(a){return a.stage==='funded' && a.status!=='closed';}).length;
  var pendingPayouts = STATE.payoutRequests.filter(function(p){return p.status==='pending';}).reduce(function(s,p){return s+p.amount;},0);
  var pendingOrders = STATE.orders.filter(function(o){return o.status==='pending';}).length;
  return '<h2>Analytics</h2><div class="grid">'+
    '<div class="card"><div class="muted">Total Revenue (confirmed)</div><h2 style="margin:4px 0">'+naira(revenue)+'</h2></div>'+
    '<div class="card"><div class="muted">Active Trader Accounts</div><h2 style="margin:4px 0">'+activeTraders+'</h2></div>'+
    '<div class="card"><div class="muted">Funded Traders</div><h2 style="margin:4px 0">'+fundedTraders+'</h2></div>'+
    '<div class="card"><div class="muted">Pending Payouts</div><h2 style="margin:4px 0">'+naira(pendingPayouts)+'</h2></div>'+
    '<div class="card"><div class="muted">Pending Orders</div><h2 style="margin:4px 0">'+pendingOrders+'</h2></div>'+
    '<div class="card"><div class="muted">Total Users</div><h2 style="margin:4px 0">'+STATE.users.length+'</h2></div></div>';
}

// ---------- SETTINGS ----------
function renderSettings(){
  var s = STATE.settings;
  return '<h2>Settings</h2><div class="card"><label>Bank Name</label><input id="s_bname" value="'+s.bank.name+'">'+
    '<label>Account Number</label><input id="s_bnum" value="'+s.bank.accountNumber+'"><label>Account Name</label><input id="s_baccname" value="'+s.bank.accountName+'">'+
    '<label>Instructions</label><input id="s_binstr" value="'+s.bank.instructions+'">'+
    '<label>Stat: Funded Traders Count</label><input id="s_traders" type="number" value="'+s.stats.tradersCount+'">'+
    '<label>Stat: Total Payouts (₦)</label><input id="s_payouts" type="number" value="'+s.stats.totalPayouts+'">'+
    '<label>Affiliate Discount % (for referred buyers)</label><input id="s_affdisc" type="number" value="'+s.affiliateDiscountRate+'">'+
    '<label>Affiliate Commission % (on payout)</label><input id="s_affcomm" type="number" value="'+s.affiliateCommissionRate+'">'+
    '<label>Min Payout (₦)</label><input id="s_minpay" type="number" value="'+s.minPayout+'">'+
    '<label>Min Affiliate Payout (₦)</label><input id="s_minaffpay" type="number" value="'+s.minAffiliatePayout+'">'+
    '<label>Low Stock Threshold</label><input id="s_lowstock" type="number" value="'+s.lowStockThreshold+'">'+
    '<label>Admin Access Code</label><input id="s_code" value="'+s.accessCode+'">'+
    '<button class="btn" onclick="saveSettings()">Save Settings</button></div>';
}
function saveSettings(){
  var s = STATE.settings;
  s.bank.name=document.getElementById('s_bname').value; s.bank.accountNumber=document.getElementById('s_bnum').value;
  s.bank.accountName=document.getElementById('s_baccname').value; s.bank.instructions=document.getElementById('s_binstr').value;
  s.stats.tradersCount=Number(document.getElementById('s_traders').value); s.stats.totalPayouts=Number(document.getElementById('s_payouts').value);
  s.affiliateDiscountRate=Number(document.getElementById('s_affdisc').value); s.affiliateCommissionRate=Number(document.getElementById('s_affcomm').value);
  s.minPayout=Number(document.getElementById('s_minpay').value); s.minAffiliatePayout=Number(document.getElementById('s_minaffpay').value);
  s.lowStockThreshold=Number(document.getElementById('s_lowstock').value); s.accessCode=document.getElementById('s_code').value;
  save();
}

boot();
</script>
