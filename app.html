<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NowFunded</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://checkout.flutterwave.com/v3.js"></script>
<script src="engine.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0e0f13);
    --text: var(--tg-theme-text-color, #f2f2f2);
    --hint: var(--tg-theme-hint-color, #8b8f9a);
    --link: var(--tg-theme-link-color, #4dabf7);
    --button: var(--tg-theme-button-color, #2f9e44);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --card: #171a21;
    --border: #262b35;
    --danger: #e0483f;
    --warn: #d9a441;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom: 80px; }
  .container { max-width:520px; margin:0 auto; padding:16px; }
  h1,h2,h3 { font-weight:700; margin:0 0 8px; }
  .muted { color:var(--hint); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .btn { background:var(--button); color:var(--button-text); border:none; border-radius:10px; padding:12px 16px; font-size:15px; font-weight:600; width:100%; cursor:pointer; }
  .btn.secondary { background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn.danger { background:var(--danger); }
  .btn:disabled { opacity:0.5; }
  input, select, textarea { width:100%; background:#11141a; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px; font-size:14px; margin-bottom:8px; }
  .tabs { display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); }
  .tab { flex:1; text-align:center; padding:12px 0; font-size:12px; color:var(--hint); cursor:pointer; }
  .tab.active { color:var(--link); }
  .badge { font-size:11px; padding:2px 8px; border-radius:20px; background:#22262f; color:var(--hint); }
  .badge.funded { background:#1b3a24; color:#4caf50; }
  .badge.active { background:#1b2a3a; color:#4dabf7; }
  .badge.breached, .badge.blown, .badge.payment_failed { background:#3a1b1b; color:var(--danger); }
  .badge.awaiting_credentials { background:#3a2f1b; color:var(--warn); }
  .cred code { background:#11141a; padding:2px 6px; border-radius:6px; }
  .hidden { display:none !important; }
  .empty { text-align:center; color:var(--hint); padding:32px 0; }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="empty" id="loading">Loading NowFunded…</div>
</div>

<div class="tabs hidden" id="tabs">
  <div class="tab active" data-tab="plans">Challenges</div>
  <div class="tab" data-tab="accounts">Accounts</div>
  <div class="tab" data-tab="wallet">Points</div>
  <div class="tab" data-tab="support">Support</div>
</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

var state = null;       // public nf.json, in memory
var privateState = null; // nf-private.json, only loaded when the user views an account's credentials
var user = null;
var activeTab = "plans";

function $(sel, root) { return (root || document).querySelector(sel); }
function el(tag, attrs, children) {
  var e = document.createElement(tag);
  for (var k in (attrs || {})) {
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}

async function boot() {
  var tgUser = NF.getTelegramUser();
  if (!tgUser) {
    $("#app").innerHTML = "<div class='empty'>Open this from the NowFunded Telegram bot.</div>";
    return;
  }
  state = await NF.loadPublic();
  var startParam = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  var result = NF.initUser(state, tgUser, startParam);
  user = result.user;
  if (result.isNew) await NF.savePublic(state);
  $("#tabs").classList.remove("hidden");
  render();
}

function render() {
  var root = $("#app");
  root.innerHTML = "";
  if (activeTab === "plans") root.appendChild(renderPlans());
  else if (activeTab === "accounts") root.appendChild(renderAccounts());
  else if (activeTab === "wallet") root.appendChild(renderWallet());
  else if (activeTab === "support") root.appendChild(renderSupport());
}

document.addEventListener("click", function (e) {
  var tab = e.target.closest(".tab");
  if (tab) {
    document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
    tab.classList.add("active");
    activeTab = tab.dataset.tab;
    render();
  }
});

// ---------- Plans / checkout ----------
function renderPlans() {
  var wrap = el("div");
  wrap.appendChild(el("h2", { html: "Challenges" }));
  var activePlans = state.plans.filter(function (p) { return p.active; });
  if (!activePlans.length) wrap.appendChild(el("div", { class: "empty", html: "No challenges available right now." }));
  activePlans.forEach(function (plan) {
    var category = state.accountCategories.find(function (c) { return c.categoryId === plan.categoryId; }) || {};
    var card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "row" }, [
      el("h3", { html: plan.name }),
      el("span", { class: "badge", html: category.name || "" })
    ]));
    card.appendChild(el("div", { class: "muted", html: "Account size: $" + plan.accountSize + " · Price: $" + plan.price }));
    card.appendChild(el("button", { class: "btn", style: "margin-top:10px;", onclick: function () { startCheckout(plan); } }, [document.createTextNode("Start challenge")]));
    wrap.appendChild(card);
  });
  return wrap;
}

async function startCheckout(plan) {
  var codeInput = prompt("Discount code (optional):", "");
  var priced = NF.applyDiscountToPrice(state, plan.price, codeInput || "", plan.planId, user.telegramId, false);
  if (priced.error) { alert(priced.error); return; }
  if (!confirm("Pay $" + priced.finalAmount + " for " + plan.name + "?")) return;

  var result = NF.createOrder(state, user.telegramId, plan.planId, codeInput || "");
  if (result.error) { alert(result.error); return; }
  await NF.savePublic(state);

  var checkoutConfig = await NF.flw("initFlutterwaveOrder", {
    orderId: result.order.orderId, amount: result.order.amount, currency: state.settings.paymentCurrency,
    telegramId: user.telegramId, name: (user.firstName + " " + user.lastName).trim()
  });

  FlutterwaveCheckout({
    public_key: checkoutConfig.public_key,
    tx_ref: checkoutConfig.tx_ref,
    amount: checkoutConfig.amount,
    currency: checkoutConfig.currency,
    customer: checkoutConfig.customer,
    callback: function () {
      // We do NOT trust this callback to finalize anything — the webhook in
      // flutterwave.gs is the only thing that confirms payment. This just
      // gives the trader a friendly "we're checking" message.
      alert("Payment received — confirming now. Check the Accounts tab shortly.");
      activeTab = "accounts";
      render();
    },
    onclose: function () {}
  });
}

// ---------- Accounts ----------
function renderAccounts() {
  var wrap = el("div");
  wrap.appendChild(el("h2", { html: "Your accounts" }));
  var accounts = NF.getUserAccounts(state, user.telegramId);
  if (!accounts.length) wrap.appendChild(el("div", { class: "empty", html: "No accounts yet — start a challenge to get going." }));
  accounts.forEach(function (a) {
    var card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "row" }, [
      el("h3", { html: a.plan.name || a.planId }),
      el("span", { class: "badge " + a.status, html: a.status.replace(/_/g, " ") })
    ]));
    card.appendChild(el("div", { class: "muted", html: "Phase: " + a.phase }));
    var credWrap = el("div", { class: "cred", id: "cred-" + a.accountId, style: "margin-top:8px;" });
    if (a.status !== "awaiting_credentials") {
      var showBtn = el("button", { class: "btn secondary", onclick: function () { showCredentials(a.accountId, credWrap); } }, [document.createTextNode("Show MT5 login")]);
      card.appendChild(showBtn);
    }
    card.appendChild(credWrap);
    if (a.status === "funded") {
      card.appendChild(el("button", { class: "btn", style: "margin-top:8px;", onclick: function () { requestPayoutFlow(a); } }, [document.createTextNode("Request payout")]));
    }
    if (a.payouts.length) {
      var pWrap = el("div", { style: "margin-top:8px;" });
      a.payouts.forEach(function (p) {
        pWrap.appendChild(el("div", { class: "row muted" }, [
          document.createTextNode("Payout $" + p.amount),
          el("span", { class: "badge", html: p.status })
        ]));
      });
      card.appendChild(pWrap);
    }
    wrap.appendChild(card);
  });
  return wrap;
}

async function showCredentials(accountId, container) {
  if (!privateState) privateState = await NF.loadPrivate();
  var cred = privateState.accountCredentials.find(function (c) { return c.accountId === accountId; });
  container.innerHTML = cred
    ? "Login: <code>" + cred.mt5Login + "</code><br>Password: <code>" + cred.mt5Password + "</code><br>Server: <code>" + cred.mt5Server + "</code>"
    : "<span class='muted'>Credentials not issued yet.</span>";
}

async function requestPayoutFlow(account) {
  var amount = prompt("Payout amount ($):");
  if (!amount) return;
  var bankName = prompt("Bank name:");
  var bankCode = prompt("Bank code:");
  var accountNumber = prompt("Account number:");
  if (!bankName || !bankCode || !accountNumber) return;

  var resolved = await NF.resolveAccountName(accountNumber, bankCode).catch(function () { return null; });
  var accountName = resolved ? resolved.accountName : prompt("Couldn't auto-verify — enter the account name:");
  if (!confirm("Send payouts to " + accountName + "?")) return;

  if (!privateState) privateState = await NF.loadPrivate();
  NF.savePayoutBank(privateState, user.telegramId, bankName, bankCode, accountNumber, accountName);
  await NF.savePrivate(privateState);

  var result = NF.requestPayout(state, user.telegramId, account.accountId, parseFloat(amount), user.username);
  if (result.error) { alert(result.error); return; }
  await NF.savePublic(state);
  alert("Payout requested — you'll be notified once it's approved and sent.");
  render();
}

// ---------- Points / discount shop ----------
function renderWallet() {
  var wrap = el("div");
  var balance = NF.getPointsBalance(state, user.telegramId);
  wrap.appendChild(el("h2", { html: "Points" }));
  wrap.appendChild(el("div", { class: "card" }, [el("div", { html: "Balance: <b>" + balance + "</b> points" })]));
  wrap.appendChild(el("h3", { html: "Redeem" }));
  state.plans.filter(function (p) { return p.active; }).forEach(function (plan) {
    var rate = state.settings.pointsPerDollar || 100;
    var maxOff = Math.min(balance, Math.ceil(plan.price * rate)) / rate;
    var card = el("div", { class: "card" });
    card.appendChild(el("div", { html: plan.name + " — up to $" + maxOff.toFixed(2) + " off" }));
    card.appendChild(el("button", { class: "btn secondary", style: "margin-top:8px;", onclick: function () { redeemFlow(plan); } }, [document.createTextNode("Redeem")]));
    wrap.appendChild(card);
  });
  return wrap;
}

async function redeemFlow(plan) {
  var result = NF.redeemPoints(state, user.telegramId, plan.planId);
  if (result.error) { alert(result.error); return; }
  await NF.savePublic(state);
  alert("Code " + result.code + " created — $" + result.discountAmount + " off, applied automatically at checkout for this plan.");
  render();
}

// ---------- Support ----------
function renderSupport() {
  var wrap = el("div");
  wrap.appendChild(el("h2", { html: "Support" }));
  var threads = state.support.filter(function (t) { return t.telegramId === user.telegramId; });
  threads.forEach(function (t) {
    var card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "row" }, [el("b", { html: t.subject }), el("span", { class: "badge", html: t.status })]));
    var msgs = state.messages.filter(function (m) { return m.threadId === t.threadId; });
    msgs.forEach(function (m) { card.appendChild(el("div", { class: "muted", html: (m.senderRole === "admin" ? "Support: " : "You: ") + m.body })); });
    wrap.appendChild(card);
  });
  var newThread = el("div", { class: "card" });
  var subject = el("input", { placeholder: "Subject" });
  var body = el("textarea", { placeholder: "How can we help?", rows: "3" });
  newThread.appendChild(subject);
  newThread.appendChild(body);
  newThread.appendChild(el("button", {
    class: "btn", onclick: async function () {
      if (!subject.value || !body.value) return;
      NF.createThread(state, user.telegramId, subject.value, body.value);
      await NF.savePublic(state);
      render();
    }
  }, [document.createTextNode("Send")]));
  wrap.appendChild(newThread);
  return wrap;
}

boot();
</script>
</body>
</html>
